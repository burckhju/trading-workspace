name: Apply reviewed positions patch
on:
  push:
    branches: [feat/positions-table-colors]
    paths: [.github/workflows/apply-reviewed-positions.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/positions-table-colors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve and verify reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          shas = [
              '1ff638c6df92053aee4bbdf91b95731410a4c245',
              'ba55a5ed7dfbd26cba80fad87f959439a02b5ddf',
              'a4e67faf1143a6286373faf85d39e1fee301c06e',
              'a7de6bf26a1af8a95676593c870cf3ceb037e9f4',
              'ad7a44983f82d840bea9e858d8af213de842c44a',
          ]
          chunks = []
          for sha in shas:
              request = urllib.request.Request(
                  'https://api.github.com/repos/burckhju/trading-workspace/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              chunk = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              chunks.append(chunk)
          patch = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '730c7e24e05b0a3f15ce2b7d1623487756d041301961ff508c8dff4279cb2273'
          pathlib.Path('/tmp/reviewed-positions.patch').write_bytes(patch)
          PY
      - name: Commit only the verified application tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = fae43775e6c6f903bd42e19471340ea4e6f424e7
          git read-tree --reset -u fae43775e6c6f903bd42e19471340ea4e6f424e7
          git apply --index /tmp/reviewed-positions.patch
          test "$(git write-tree)" = f4dc41c3d9876b56ff362ac069a627b9ae0770ff
          test ! -e .github/workflows/positions-source-export.yml
          test ! -e .github/workflows/apply-reviewed-positions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(workspace): searchable colored positions table and readable product selection'
          git push origin HEAD:refs/heads/feat/positions-table-colors
          printf 'Verified tree: %s\nApplication commit: %s\n' "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
