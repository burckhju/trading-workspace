name: Verify trade source transfer
on:
  push:
    branches: [fix/duplicate-trade-cancellation]
    paths: [.github/workflows/apply-trade-capture.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read isolated transfer objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/trade-transfer
          gh api repos/burckhju/trading-workspace/git/blobs/d6d97ad25e513249d00c9fe92b28d0c240318b3a > /tmp/trade-transfer/part0.json
          gh api repos/burckhju/trading-workspace/git/blobs/7ff59063e8cb6064317fc00d95a8980a9c890f50 > /tmp/trade-transfer/part1.json
          gh api repos/burckhju/trading-workspace/git/blobs/bc887c28f9d0297acf0467a2be290e28611458fd > /tmp/trade-transfer/part2.json
      - name: Verify original bytes and assemble reviewed application tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path('/tmp/trade-transfer')
          fixes = {0: [(583,584,''),(2042,2043,''),(6714,6716,'')], 1: [], 2: [(10755,10755,'8F'),(18296,18296,'A=')]}
          hashes = ['b55ba70d1c14b6b1053e33971d274652794a222c','7ff59063e8cb6064317fc00d95a8980a9c890f50','358f287013953cdf9172938cb51984182345794d']
          parts = []
          for i, wanted in enumerate(hashes):
              encoded = ''.join(json.loads((root / f'part{i}.json').read_text())['content'].split())
              for start,end,value in reversed(fixes[i]):
                  encoded = encoded[:start] + value + encoded[end:]
              raw = base64.b64decode(encoded, validate=True)
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == wanted, i
              parts.append(raw)
          patch = gzip.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == '33f2e1336e64fb587bd7a821aceecde22de332f7895d817568ce30adac5e7f0d'
          file = root / 'verified.patch'
          file.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(file)],check=True)
          subprocess.run(['git','apply','--index',str(file)],check=True)
          subprocess.run(['git','rm','.github/workflows/apply-trade-capture.yml'],check=True)
          expected = '7e4318f31ea837042c53bdec8b2578e38ea0acff'
          assert subprocess.check_output(['git','write-tree'],text=True).strip() == expected
          entries = []
          for line in subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines():
              status, path = line.split('\t')
              # Workflow modifications are completed through the authorized connector,
              # not through the Actions token. The final full tree must still match expected.
              if path.startswith('.github/workflows/'): continue
              entry = {'path':path,'mode':'100644','type':'blob'}
              if status == 'D': entry['sha'] = None
              else: entry['content'] = pathlib.Path(path).read_text(encoding='utf-8')
              entries.append(entry)
          body = {'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree':entries}
          request = root / 'tree-request.json'
          request.write_text(json.dumps(body))
          result = json.loads(subprocess.check_output(['gh','api','--method','POST','repos/burckhju/trading-workspace/git/trees','--input',str(request)],text=True))
          (root/'application-tree-sha.txt').write_text(result['sha'])
          print('Application-only remote tree:', result['sha'])
          print('Required final tree after connector workflow changes:', expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-transfer-verification
          path: /tmp/trade-transfer
          retention-days: 1
