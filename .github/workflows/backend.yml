name: Backend

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/unit/backend/**'
      - 'tests/integration/backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend / quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install --requirement requirements-dev.txt
      - name: Ruff
        run: ruff check app ../tests/unit/backend ../tests/integration/backend
      - name: Black
        run: black --check --config pyproject.toml app ../tests/unit/backend ../tests/integration/backend
      - name: mypy
        run: mypy app
      - name: Tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: >-
          pytest ../tests/unit/backend ../tests/integration/backend
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
