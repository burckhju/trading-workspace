name: Backend

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/unit/backend/**'
      - 'tests/integration/backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend / quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading_workspace
          POSTGRES_PASSWORD: trading_workspace_ci
          POSTGRES_DB: trading_workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_workspace -d trading_workspace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TRADING_WORKSPACE_DATABASE_URL: postgresql+asyncpg://trading_workspace:trading_workspace_ci@localhost:5432/trading_workspace_test
      TRADING_WORKSPACE_TEST_DATABASE_URL: postgresql+asyncpg://trading_workspace:trading_workspace_ci@localhost:5432/trading_workspace_test

    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install --requirement requirements-dev.txt
      - name: Ruff
        run: ruff check app ../tests/unit/backend ../tests/integration/backend
      - name: Black
        run: black --config pyproject.toml app ../tests/unit/backend ../tests/integration/backend && git diff --exit-code
      - name: mypy
        run: mypy app
      - name: Migrate PostgreSQL test database
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: alembic upgrade head

      - name: Tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: >-
          pytest -c pyproject.toml ../tests/unit/backend ../tests/integration/backend
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error
