name: Black Format Diff

on:
  pull_request:

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show exact Black diff
        working-directory: backend
        run: |
          python -m pip install black==26.1.0
          black --diff --config pyproject.toml ../tests/unit/backend/features/position_monitoring/test_product_valuation.py || true
