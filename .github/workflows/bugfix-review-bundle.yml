name: Bugfix review development bundle
on:
  push:
    branches: [devtools/bugfix-review-20260915]
    paths: [.github/workflows/bugfix-review-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c99ba9a1b1209e05fdc6b6a486c74f6e3be832b8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Install unchanged locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Archive development dependencies only
        run: |
          mkdir -p /tmp/bugfix-review-frontend
          tar -czf /tmp/bugfix-review-frontend/node-modules.tar.gz -C frontend node_modules
          sha256sum frontend/package-lock.json > /tmp/bugfix-review-frontend/lock.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bugfix-review-c99ba9a-frontend-dependencies
          path: /tmp/bugfix-review-frontend/
          if-no-files-found: error
          retention-days: 1
