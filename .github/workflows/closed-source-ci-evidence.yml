name: Collect pinned integration CI evidence
on:
  push:
    branches: [transport/closed-source-integration-20261021]
    paths: [.github/workflows/closed-source-ci-evidence.yml]
permissions:
  actions: read
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Capture the four specified integration runs without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, os, pathlib, re, time, urllib.request
          root = pathlib.Path('evidence')
          base = 'https://api.github.com/repos/burckhju/trading-workspace'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          class StripAuth(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  request = super().redirect_request(req, fp, code, msg, hdrs, newurl)
                  if request is not None: request.remove_header('Authorization')
                  return request
          opener = urllib.request.build_opener(StripAuth())
          def read(path):
              with opener.open(urllib.request.Request(base+path, headers=headers), timeout=60) as response:
                  data = response.read(32*1024*1024+1)
                  assert len(data) <= 32*1024*1024
                  return data
          def get(path): return json.loads(read(path))
          runs = [39667558465,39667558242,39667558238,39667558281]
          head = 'ac3dc9405dd7ba9a37839b9b75a12c435ca2be02'
          deadline = time.monotonic()+1200
          pending = set(runs)
          while pending:
              for run_id in list(pending):
                  data = get(f'/actions/runs/{run_id}')
                  assert data['head_sha'] == head and data['event'] == 'pull_request'
                  if data['status'] != 'completed': continue
                  (root/f'run-{run_id}.json').write_text(json.dumps(data,indent=2))
                  jobs = get(f'/actions/runs/{run_id}/jobs?per_page=100')
                  assert jobs['total_count'] == len(jobs['jobs'])
                  (root/f'jobs-{run_id}.json').write_text(json.dumps(jobs,indent=2))
                  for job in jobs['jobs']:
                      if job['conclusion'] == 'skipped': continue
                      log = read(f"/actions/jobs/{job['id']}/logs")
                      (root/f"job-{job['id']}.log").write_bytes(log)
                  print('Recorded',run_id,data['conclusion'],flush=True)
                  pending.remove(run_id)
              if pending:
                  if time.monotonic() >= deadline: raise RuntimeError('Pinned runs still incomplete: '+str(pending))
                  time.sleep(15)
          summary = []
          for path in sorted(root.glob('*.log')):
              lines = path.read_text(errors='replace').splitlines()
              summary += [path.name]+[line for line in lines if re.search(r'passed|failed|skipped|coverage|Coverage|files would|source files|Test Files|Tests |HEAD is now|[0-9a-f]{40}$',line) and len(line)<1200]
          (root/'bounded-summary.txt').write_text('\n'.join(summary)+'\n')
          manifest = [{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir())]
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-integration-ci-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: error
