name: Import reviewed source return layout
on:
  push:
    branches: [transport/closed-source-integration-20261021]
    paths: [.github/workflows/closed-source-layout-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac3dc9405dd7ba9a37839b9b75a12c435ca2be02
          persist-credentials: false
      - name: Verify exact three-file visual follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          encoded=''
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==1732 and hashlib.sha256(data).hexdigest()=='1ce6ef1287f9381c10ce6a5ab0059196eba520f50ac98d4d5b2c66005b76d6d8'
          dec=lzma.LZMADecompressor();patch=dec.decompress(data,max_length=4351)
          assert dec.eof and not dec.unused_data and len(patch)==4350
          assert hashlib.sha256(patch).hexdigest()=='15969d8876f19145db536b016dbcabeb5205391d60dc7698b3b604693fd0b584'
          def git(*a,data=None): return subprocess.check_output(['git',*a],input=data).decode().strip()
          base='ac3dc9405dd7ba9a37839b9b75a12c435ca2be02';tree='3c282766c937a3a9623d66ef0032dcc7b74bedf0';head='f1898487a8c48af1429ae0ecf17936cfebf4db2f'
          assert git('rev-parse','HEAD')==base
          git('apply','--check','--index','-',data=patch);git('apply','--index','-',data=patch)
          assert set(git('diff','--cached','--name-only').splitlines())=={'frontend/src/features/trade/components/TradeSourcesView.tsx','tests/e2e/support/trade_source_journey.ts','tests/e2e/closed-trades-report-postgres.spec.ts'}
          git('diff','--cached','--check');assert git('write-tree')==tree
          raw=(f'tree {tree}\nparent {base}\nauthor AI development assistant <noreply@example.invalid> 1792613739 +0000\ncommitter AI development assistant <noreply@example.invalid> 1792613739 +0000\n\nfix(trade): separate return targets on desktop and mobile\n').encode()
          assert git('hash-object','-t','commit','-w','--stdin',data=raw)==head
          print('Verified',head,tree)
          PY
      - name: Publish new staging reference only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=refs/heads/transport/closed-source-layout-ready
          head=f1898487a8c48af1429ae0ecf17936cfebf4db2f
          existing=$(git ls-remote origin "$ref" | cut -f1)
          test -z "$existing" || test "$existing" = "$head"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$head:$ref"
