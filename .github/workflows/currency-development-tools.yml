name: Currency development tools
on:
  push:
    branches: [feat/currency-catalog-administration]
    paths: [.github/workflows/currency-development-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Assemble isolated formatter toolchain and tracked sources
        run: |
          mkdir -p /tmp/currency-tools
          python -m pip install --target /tmp/currency-tools/python black==26.1.0 ruff==0.15.1
          cd frontend
          npm ci --no-audit --no-fund
          cp -a node_modules/prettier /tmp/currency-tools/prettier
          cd ..
          git archive HEAD > /tmp/currency-tools/source.tar
          tar -czf /tmp/currency-tools.tar.gz -C /tmp currency-tools
      - uses: actions/upload-artifact@v4
        with:
          name: currency-development-tools
          path: /tmp/currency-tools.tar.gz
          retention-days: 1
