name: Currency development tools
on:
  push:
    branches: [feat/currency-catalog-administration]
    paths: [.github/workflows/currency-development-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Assemble isolated test toolchain and reference data
        run: |
          mkdir -p /tmp/currency-tools
          python -m pip install --target /tmp/currency-tools/python -r backend/requirements-dev.txt
          cd frontend
          npm ci --no-audit --no-fund
          cp -a node_modules /tmp/currency-tools/node_modules
          cd ..
          curl --fail --show-error --location --max-time 60 'https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml' -o /tmp/currency-tools/list-one.xml
          sha256sum /tmp/currency-tools/list-one.xml
          git archive HEAD > /tmp/currency-tools/source.tar
          tar -czf /tmp/currency-tools.tar.gz -C /tmp currency-tools
      - uses: actions/upload-artifact@v4
        with:
          name: currency-development-tools
          path: /tmp/currency-tools.tar.gz
          retention-days: 1
