name: D01-C Black Format Probe

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Black
        run: python -m pip install black==26.1.0
      - name: Format and print target
        run: |
          cd backend
          black --config pyproject.toml ../tests/integration/backend/database/test_daily_price_instrument_migration_postgres.py
          echo '---D01C_BLACK_BEGIN---'
          cat ../tests/integration/backend/database/test_daily_price_instrument_migration_postgres.py
          echo '---D01C_BLACK_END---'
