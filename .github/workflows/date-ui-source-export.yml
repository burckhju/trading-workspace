name: Date UI source export
on:
  push:
    branches: [fix/execution-date-editing]
    paths: [.github/workflows/date-ui-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked code only
        run: |
          mkdir -p /tmp/date-ui-source
          git archive --format=tar HEAD > /tmp/date-ui-source/source.tar
          git rev-parse HEAD > /tmp/date-ui-source/commit.txt
          git rev-parse 'HEAD^{tree}' > /tmp/date-ui-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: date-ui-tracked-source
          path: /tmp/date-ui-source
          retention-days: 1
