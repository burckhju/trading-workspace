name: German locale source verification
on:
  push:
    branches: [fix/deutsche-oberflaeche-zahlen]
    paths: [.github/workflows/de-locale-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned development wheels only
        run: |
          python -m pip download --only-binary=:all: --dest /tmp/de-locale-tools black==26.1.0 ruff==0.15.1 mypy==1.19.1 asyncpg==0.31.0
      - uses: actions/upload-artifact@v4
        with:
          name: de-locale-tools
          path: /tmp/de-locale-tools/*.whl
          retention-days: 1
