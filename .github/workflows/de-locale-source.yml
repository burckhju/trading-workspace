name: German locale source verification
on:
  push:
    branches: [fix/deutsche-oberflaeche-zahlen]
    paths: [.github/workflows/de-locale-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked current main only
        run: |
          mkdir -p /tmp/de-locale-main
          git archive 3b344855d56e8add972d2459d5a15c32c8e9c230 | gzip > /tmp/de-locale-main/main.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: de-locale-updated-main
          path: /tmp/de-locale-main/*.tar.gz
          retention-days: 1
