name: End-to-End

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'VERSION'
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "tests/e2e/**"
      - "scripts/run-realized-gross-e2e.sh"
      - "scripts/run-journal-evidence-e2e.sh"
      - "scripts/check-journal-e2e-report.py"
      - "scripts/test-journal-api-guard.mjs"
      - "scripts/run-e2e.sh"
      - "tests/unit/backend/test_journal_e2e_contracts.py"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: End-to-End / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: trading_workspace
      POSTGRES_USER: trading_workspace
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "5432"
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "8080"
      TRADING_WORKSPACE_DATABASE_URL: postgresql+asyncpg://trading_workspace:ci-only-password@database:5432/trading_workspace
      VITE_API_BASE_URL: http://localhost:8080/api
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      CURRENCY_E2E_WRITES_ALLOWED: "1"
      TRADE_E2E_WRITES_ALLOWED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Use reliable Ubuntu apt mirror
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and start stack
        run: docker compose -f docker/compose.yml up --build --wait --wait-timeout 180
      - name: Migrate disposable E2E database
        run: docker compose -f docker/compose.yml run --rm --no-deps -T backend python -m alembic upgrade head
      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Capture container logs
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color > docker-compose.log
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose -f docker/compose.yml down --volumes --remove-orphans

  realized-gross-owner:
    name: End-to-End / realized gross owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify existing release prerequisites
        run: bash scripts/verify-release-readiness.sh
      - name: Install pinned frontend and database-guard dependencies
        run: |
          npm --prefix frontend ci
          python -m pip install --requirement backend/requirements.txt
      - name: Use reliable Ubuntu apt mirror
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Qualify actual report writes and reads on an isolated Compose stack
        run: bash scripts/run-realized-gross-e2e.sh
      - name: Upload report browser, migration and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realized-gross-owner-e2e
          path: frontend/test-results/realized-gross-*/
          if-no-files-found: warn

  journal-evidence-owner:
    name: End-to-End / journal and evidence owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Verify existing release prerequisites
        run: bash scripts/verify-release-readiness.sh
      - name: Install pinned frontend and fixture dependencies
        run: |
          npm --prefix frontend ci
          python -m pip install --requirement backend/requirements-dev.txt
      - name: Verify fail-closed target and result contracts
        run: |
          python -m pytest -c backend/pyproject.toml tests/unit/backend/test_journal_e2e_contracts.py
          node --test scripts/test-journal-api-guard.mjs
      - name: Use reliable Ubuntu apt mirror
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Qualify both existing learning journeys on their own verified stack
        run: bash scripts/run-journal-evidence-e2e.sh
      - name: Upload learning test IDs, traces, source snapshots and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-evidence-owner-e2e
          path: frontend/test-results/journal-evidence-*/
          if-no-files-found: error
