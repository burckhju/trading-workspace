name: End-to-End

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: trading_workspace
      POSTGRES_USER: trading_workspace
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: '5432'
      BACKEND_PORT: '8000'
      FRONTEND_PORT: '8080'
      TRADING_WORKSPACE_DATABASE_URL: postgresql+asyncpg://trading_workspace:ci-only-password@database:5432/trading_workspace
      VITE_API_BASE_URL: http://localhost:8080/api
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and start stack
        run: docker compose -f docker/compose.yml up --build --wait --wait-timeout 180
      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Capture container logs
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color > docker-compose.log
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose -f docker/compose.yml down --volumes --remove-orphans
