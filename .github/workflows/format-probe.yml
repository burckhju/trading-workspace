name: Format Probe

on:
  push:
    branches:
      - feat/warrant-position-valuation

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Black
        working-directory: backend
        run: |
          python -m pip install black==26.1.0
          black --config pyproject.toml ../tests/unit/backend/features/position_monitoring/test_product_valuation.py
          git diff -- ../tests/unit/backend/features/position_monitoring/test_product_valuation.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Probe Prettier
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/features/trade/components/ProductValuationPanel.tsx
          git diff -- src/features/trade/components/ProductValuationPanel.tsx
