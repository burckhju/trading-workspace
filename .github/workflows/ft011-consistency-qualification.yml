name: FT011 consistency qualification
on:
  push:
    branches: [dev/ft011-materialization-consistency-20261016]
    paths: [.github/workflows/ft011-consistency-qualification.yml]
permissions:
  contents: read
concurrency:
  group: ft011-consistency-qualification
  cancel-in-progress: false
env:
  TRADING_WORKSPACE_MARKET_DATA__REFRESH__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__REFRESH__AUTO_CONFIGURE: 'false'
  TRADING_WORKSPACE_POSITION_MONITORING__ENABLED: 'false'
  TRADING_WORKSPACE_NOTIFICATION__TELEGRAM__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__EODHD__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__VONTOBEL_MARKETS__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__STUTTGART_DELAYED__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__GETTEX_DELAYED__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__FRANKFURT__ENABLED: 'false'
jobs:
  integrate:
    if: github.repository == 'burckhju/trading-workspace' && github.ref == 'refs/heads/dev/ft011-materialization-consistency-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.patch.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Verify exact reviewed patch and remove transport before test checkout
        id: patch
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          base='3faf0f768b23c719cb16239280a2c9875d9ae451'
          parts=[f'.github/ft011-consistency.{i}.b64' for i in range(3)]
          helpers=set(parts+['.github/workflows/ft011-consistency-qualification.yml'])
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())==helpers
          raw=''.join(pathlib.Path(p).read_text().strip() for p in parts)
          patch=lzma.decompress(base64.b64decode(raw,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='2c2e42d27befb264bc23ff31119ea5aa101de544d134478a2324e2f2edd923cb'
          paths=set('''backend/app/features/learning/api/materialization_dependencies.py
          backend/app/features/learning/api/materialization_router.py
          backend/app/features/learning/application/ft011_evidence_history_service.py
          backend/app/features/learning/application/ft011_materialization_service.py
          backend/app/features/learning/persistence/ft011_materialization_repository.py
          backend/app/features/learning/persistence/lesson_evidence_read_repository.py
          backend/app/features/post_trade/application/exit_review_service.py
          backend/app/features/post_trade/application/materialization_handoff.py
          backend/app/features/post_trade/persistence/materialization_guard.py
          docs/decisions/ADR-POST-FT012-004-FT011-EVIDENCE-MATERIALIZATION-OWNERSHIP.md
          docs/decisions/ADR-POST-FT012-007-MATERIALIZATION-CONSISTENCY.md
          docs/foundation/TRACEABILITY.md
          docs/implementation/FT011_MATERIALIZATION_CONSISTENCY_DOR.md
          docs/planning/PRODUCT_BACKLOG.md
          frontend/src/features/learning/components/Ft011EvidenceHistory.test.tsx
          frontend/src/features/learning/components/Ft011EvidenceHistory.tsx
          frontend/src/features/learning/components/LessonReviewPanel.test.tsx
          frontend/src/features/learning/components/LessonReviewPanel.tsx
          frontend/src/features/learning/pages/LessonDetailPage.tsx
          frontend/src/features/learning/services/materializationClient.ts
          frontend/src/features/learning/types/materialization.ts
          frontend/src/features/post_trade/pages/PostTradeLearningPage.test.tsx
          frontend/src/features/post_trade/pages/PostTradeLearningPage.tsx
          frontend/src/features/post_trade/services/errors.ts
          tests/e2e/post-trade-evidence-history-postgres.spec.ts
          tests/integration/backend/learning/test_ft011_consistency_postgres.py
          tests/unit/backend/features/learning/test_ft011_evidence_history.py
          tests/unit/backend/features/learning/test_ft011_materialization_version_pin.py
          tests/unit/backend/features/post_trade/test_journal_source_inspection.py
          tests/unit/backend/features/post_trade/test_materialization_handoff.py'''.split())
          stats=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {row.split('\t')[2] for row in stats.splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','rm',*sorted(helpers)],check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='3fe2d0e1d1ffb4de71105763e7c022dc3fefe86e'
          PY
          test "$(git ls-remote origin refs/heads/dev/ft011-materialization-consistency-20261016 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(learning): guard FT011 source handoff and expose historical evidence'
          git push origin HEAD:refs/heads/dev/ft011-materialization-consistency-20261016
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD HEAD^{tree}
  backend:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading_workspace
          POSTGRES_PASSWORD: ft011-ci-only
          POSTGRES_DB: trading_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trading_workspace -d trading_workspace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRADING_WORKSPACE_DATABASE_URL: postgresql+asyncpg://trading_workspace:ft011-ci-only@localhost:5432/trading_workspace_test
      TRADING_WORKSPACE_TEST_DATABASE_URL: postgresql+asyncpg://trading_workspace:ft011-ci-only@localhost:5432/trading_workspace_test
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Verify fresh disposable database context
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test ! -f .env
          test ! -f backend/.env
          mkdir -p qualification
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u=urlparse(os.environ['TRADING_WORKSPACE_TEST_DATABASE_URL'])
          assert u.hostname=='localhost' and u.port==5432 and u.path=='/trading_workspace_test'
          PY
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Migrate PostgreSQL and verify unchanged single schema head
        working-directory: backend
        run: |
          set -euo pipefail
          python -m alembic heads | tee ../qualification/heads.log
          test "$(python -m alembic heads)" = '20261014_0046 (head)'
          python -m alembic upgrade head 2>&1 | tee ../qualification/migration.log
          python -m alembic current | tee ../qualification/current.log
      - name: Actual source races, historical relations and focused owner contracts
        run: |
          set -euo pipefail
          python -m pytest -c backend/pyproject.toml tests/integration/backend/learning/test_ft011_consistency_postgres.py tests/unit/backend/features/learning/test_ft011*.py tests/unit/backend/features/post_trade/test_materialization_handoff.py tests/unit/backend/features/post_trade/test_journal_source_inspection.py -vv 2>&1 | tee qualification/targeted.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft011-consistency-backend-targeted
          path: qualification
          retention-days: 7
      - name: Unmodified complete backend gate
        if: always()
        run: |
          set -euo pipefail
          bash scripts/check-backend.sh 2>&1 | tee qualification/backend-full.log
          git diff --exit-code
          git diff --check
          cd backend
          test "$(python -m alembic heads)" = '20261014_0046 (head)'
          python -m alembic current | tee ../qualification/current-after.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft011-consistency-backend-full
          path: |
            qualification
            backend/coverage.xml
          retention-days: 7
  frontend:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm --prefix frontend ci
      - name: Exact checkout and focused history UI tests
        run: |
          set -euo pipefail
          mkdir -p qualification
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          cd frontend
          npx vitest run src/features/learning/components/Ft011EvidenceHistory.test.tsx src/features/learning/components/LessonReviewPanel.test.tsx src/features/post_trade/pages/PostTradeLearningPage.test.tsx 2>&1 | tee ../qualification/frontend-targeted.log
      - name: Unmodified complete frontend gate
        run: |
          set -euo pipefail
          bash scripts/check-frontend.sh 2>&1 | tee qualification/frontend-full.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft011-consistency-frontend
          path: |
            qualification
            frontend/coverage
          retention-days: 7
  browser-postgres:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      POSTGRES_DB: trading_workspace_test
      POSTGRES_USER: trading_workspace
      POSTGRES_PASSWORD: ft011-browser-ci-only
      POSTGRES_PORT: '25432'
      BACKEND_PORT: '8000'
      FRONTEND_PORT: '8080'
      E2E_POSTGRES_PORT: '25432'
      E2E_BACKEND_PORT: '8000'
      E2E_FRONTEND_PORT: '8080'
      E2E_PLAYWRIGHT_BASE_URL: http://localhost:8080
      E2E_VITE_API_BASE_URL: http://localhost:8080/api
      VITE_API_BASE_URL: http://localhost:8080/api
      TRADING_WORKSPACE_TEST_DATABASE_URL: postgresql+asyncpg://trading_workspace:ft011-browser-ci-only@127.0.0.1:25432/trading_workspace_test
      FT011_E2E_WRITES_ALLOWED: '1'
      JOURNAL_E2E_WRITES_ALLOWED: '1'
      TRADE_E2E_WRITES_ALLOWED: '1'
      CURRENCY_E2E_WRITES_ALLOWED: '1'
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Verify exclusively owned disposable Compose project before writes
        id: safety
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test ! -f .env
          test ! -f backend/.env
          test ! -f frontend/.env
          test ! -f docker/.env
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=trading-workspace-e2e)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=trading-workspace-e2e)"
          test ! -d docker/stuttgart-data
          python - <<'PY'
          import os,socket
          from urllib.parse import urlparse
          u=urlparse(os.environ['TRADING_WORKSPACE_TEST_DATABASE_URL'])
          assert u.hostname=='127.0.0.1' and u.port==25432 and u.path=='/trading_workspace_test'
          for port in (25432,8000,8080):
              with socket.socket() as s:s.bind(('127.0.0.1',port))
          PY
          mkdir -p qualification docker/stuttgart-data
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          echo 'disposable_owned=true' >> "$GITHUB_OUTPUT"
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and migrate only the verified disposable project
        run: |
          set -euo pipefail
          docker compose --project-name trading-workspace-e2e -f docker/compose.yml up --build --wait --wait-timeout 180
          docker compose --project-name trading-workspace-e2e -f docker/compose.yml run --rm --no-deps -T backend python -m alembic upgrade head
      - name: Real correction and historical evidence navigation twice without retries
        working-directory: frontend
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          npx playwright test ../tests/e2e/post-trade-evidence-history-postgres.spec.ts --repeat-each=2 --retries=0 --trace=on 2>&1 | tee ../qualification/browser-targeted.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft011-consistency-browser-targeted
          path: |
            qualification
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Unmodified complete E2E gate with authorized synthetic writes
        if: always() && steps.safety.outputs.disposable_owned == 'true'
        run: |
          set -euo pipefail
          bash scripts/run-e2e.sh 2>&1 | tee qualification/browser-full.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft011-consistency-browser-full
          path: |
            qualification
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Cleanup only the newly owned disposable project
        if: always() && steps.safety.outputs.disposable_owned == 'true'
        run: docker compose --project-name trading-workspace-e2e -f docker/compose.yml down --volumes --remove-orphans
