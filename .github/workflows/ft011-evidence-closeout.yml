name: FT011 evidence closeout
on:
  push:
    branches: [dev/ft011-materialization-consistency-20261016]
    paths: [.github/workflows/ft011-evidence-closeout.yml]
permissions:
  contents: read
jobs:
  documentation:
    if: github.repository == 'burckhju/trading-workspace' && github.ref == 'refs/heads/dev/ft011-materialization-consistency-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Apply only four verified documentation changes and remove this helper
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          base='0863248b0c44e7c36d41b29acbef56b451d2592f'
          helpers={'.github/ft011-documentation.b64','.github/workflows/ft011-evidence-closeout.yml'}
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())==helpers
          patch=lzma.decompress(base64.b64decode(pathlib.Path('.github/ft011-documentation.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='1688ea7fd36fdf7ef4c05a95665c035e10b4ff3d65021dcca02952c754985242'
          paths={'docs/decisions/ADR-POST-FT012-007-MATERIALIZATION-CONSISTENCY.md','docs/implementation/FT011_MATERIALIZATION_CONSISTENCY_DOR.md','docs/foundation/TRACEABILITY.md','docs/planning/PRODUCT_BACKLOG.md'}
          stats=subprocess.check_output(['git','apply','--numstat'],input=patch).decode()
          assert {row.split('\t')[2] for row in stats.splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','rm',*sorted(helpers)],check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='060930e3ea618d36cd32c6ecb2f753fc450e36be'
          PY
          test "$(git ls-remote origin refs/heads/dev/ft011-materialization-consistency-20261016 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(learning): record qualified consistency and inventory in central backlog'
          git push origin HEAD:refs/heads/dev/ft011-materialization-consistency-20261016
          git rev-parse HEAD HEAD^{tree}
