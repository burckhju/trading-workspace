name: German UI development sources
on:
  push:
    branches: [fix/german-language-number-format]
    paths: [.github/workflows/german-ui-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned development tools only
        run: |
          mkdir -p /tmp/german-ui-tools
          python -m pip download --only-binary=:all: --dest /tmp/german-ui-tools black==26.1.0 ruff==0.15.1
      - uses: actions/upload-artifact@v4
        with:
          name: german-ui-lint-tools
          path: /tmp/german-ui-tools/*.whl
          retention-days: 1
