name: Handoff qualification followthrough

on:
  push:
    branches: [dev/post-trade-handoff-qualification-20261014]
    paths: [.github/workflows/handoff-qualification-followthrough.yml]

permissions:
  contents: read

concurrency:
  group: handoff-qualification-followthrough
  cancel-in-progress: false

jobs:
  frontend-standard-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b40c5cc120512a3f8b5c5af36bcaf06691f920ed
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Verify isolated source before installation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = b40c5cc120512a3f8b5c5af36bcaf06691f920ed
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files -- AGENTS.md '**/AGENTS.md')"
          test ! -e .env && test ! -e frontend/.env
          cat scripts/check-frontend.sh frontend/.npmrc frontend/package.json
      - run: npm --prefix frontend ci
      - name: Unmodified frontend gate without a browser-specific environment override
        run: |
          set -euo pipefail
          env -u VITE_API_BASE_URL -u PLAYWRIGHT_BASE_URL bash scripts/check-frontend.sh 2>&1 | tee "$RUNNER_TEMP/frontend-standard-gate.log"
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-standard-environment-gate
          path: ${{ runner.temp }}/frontend-standard-gate.log
          retention-days: 7
          if-no-files-found: error

  document-verified-evidence:
    needs: frontend-standard-environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TASK_BRANCH: dev/post-trade-handoff-qualification-20261014
      EVIDENCE_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify authorized development ref and exact documentation inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TASK_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 8f2a423107c91b286d1c261d38a7e4b3f209b578
          test "$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files -- AGENTS.md '**/AGENTS.md')"
      - name: Update only existing evidence documents and central backlog
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          hashes = {
              'docs/planning/PRODUCT_BACKLOG.md': 'ed091d4d94ca8e30dc8c991c7104f79833325d24',
              'docs/foundation/TRACEABILITY.md': '5d497efc0da4817c104bec05c784178a278bb672',
              'docs/implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md': '1754d97abfac99feac699c2245848d7e5e4c0649',
              'docs/decisions/ADR-POST-FT012-004-FT011-EVIDENCE-MATERIALIZATION-OWNERSHIP.md': 'de761ec18659531900686703ab60658db0117cf7',
              'docs/implementation/POST_TRADE_LEARNING_HANDOFF_DOR.md': 'cf7ccac4745d4058b534df740f67234702b60810',
          }
          texts = {}
          for name, sha in hashes.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha, name
              texts[name] = data.decode()

          def once(source, old, new):
              assert source.count(old) == 1, old[:80]
              return source.replace(old, new, 1)

          report = 'docs/implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md'
          addition = '''## Technische Fortschreibung — 14.10.2026

          Der begrenzte Review-Pin-/Readback-Schnitt ist im vollständigen Repository
          auf `dev/post-trade-handoff-qualification-20261014` integriert:
          [Draft-PR #259](https://github.com/burckhju/trading-workspace/pull/259).
          Der Journal-/Lern-Gesamtabschluss bleibt offen. Nur das zentrale Backlog
          führt Arbeitsstatus; technische Prüfung ist keine Fach-/Betriebsabnahme.

          ### Identifizierte Prüfstände

          Basis: `2ac107d04f9b2f6b2636009da6ad16af59550df5` (v1.5.6).
          Implementierung: `b40c5cc120512a3f8b5c5af36bcaf06691f920ed`, vollständiger
          Tree `25f7269dc471e9f512887a22221fc89418f7995a`.
          Der Zusatzworkflow auf `8f2a423107c91b286d1c261d38a7e4b3f209b578` testet
          den gepinnten b40-Anwendungscode. Reguläre PR-Läufe auf 8f testen
          `173c952f71c3d51936a988ecd86332102e8cb170`, GitHubs synthetischen Testmerge
          mit main, keinen tatsächlich vollzogenen Merge. Spätere Heads separat prüfen.

          ### Technische Belege

          | Prüfung | Stand / Lauf | Ergebnis |
          |---|---|---|
          | Unverändertes `bash scripts/check-backend.sh` | b40; [38613983711](https://github.com/burckhju/trading-workspace/actions/runs/38613983711) | Ruff, Black (912 Dateien), mypy (523 Quelldateien), 2600 Tests bestanden; Coverage 86,15 % bei unveränderter 85-%-Schwelle |
          | Unabhängige PostgreSQL-Transaktionen | b40; gleicher Lauf, `test_ft011_materialization_command_postgres.py` | Drei Fälle bestanden: gleiche/verschiedene Keys, Rollback ohne orphan Evidence, Retry, falsche/veraltete/ersetzte Quelle |
          | Migrationen | b40; `alembic heads`, `upgrade head`, `current` | Ein Head `20261012_0045`; lokaler Graphabgleich: 45 Revisionen, keine fehlenden Eltern; keine neue Migration |
          | Reguläre Frontend-CI | 8f-Testmerge; [38613992924](https://github.com/burckhju/trading-workspace/actions/runs/38613992924) | TypeScript, ESLint, Prettier, 456 Tests in 99 Dateien, Coverage-Gates und Build bestanden; Lines/Statements 92,21 %, Branches 83,39 %, Functions 84,42 % |
          | Reguläre End-to-End-CI | 8f-Testmerge; [38613992910](https://github.com/burckhju/trading-workspace/actions/runs/38613992910) | Docker-Build, Migration und 51 Browserfälle bestanden; 0 fehlgeschlagen/flaky/skipped |
          | Neue Handoff-Browserfälle | Drei der 51; zusätzlich separat gegen b40 im Zusatzlauf | Explizite Reviewfinalisierung, gepinnte Materialisierung, ausdrückliche Interpretation; Versionswechsel ohne automatischen Retry; historischer Replay ohne CURRENT-Fiktion |

          Die drei PostgreSQL-Fälle sind Teil der 2600, nicht zusätzliche 2603
          unterschiedliche Tests. Die drei neuen Browserfälle sind Teil der 51.
          Die neuen Browserfälle fangen synthetische HTTP-Antworten ab: kein
          Browser-zu-Datenbank-Beweis der vollständigen Nutzerreise. Die PostgreSQL-
          Fixture beginnt mit einem qualifizierten Reviewgraphen, nicht mit einem
          durch reale Capture-Commands erzeugten synthetischen BUY/SELL-Voll-Exit.

          Die zehn vorab festgelegten DoR-Kriterien besitzen jetzt abgegrenzte
          Application-/API-/React- sowie PostgreSQL-/Browserbelege. Pin und semantische
          Eindeutigkeit sind geprüft; FT-011 bleibt der einzige Readiness-Owner.
          Keine Aussage über atomare Serialisierung gegen eine Upstream-Korrektur
          nach dem Handoff-Read oder über unveränderte historische Lesson-Versionen
          über die gesamte Execution-/Journal-Korrekturkette.

          ### Umgebungs-, Fehler- und Betriebsgrenzen

          Frische GitHub-Runner, synthetische UUIDs und PostgreSQL 17 auf
          `localhost:5432/trading_workspace_test`; Ziel und Alembic-Head werden geprüft.
          Keine private .env/Nutzer-Volumes. Provider, Scheduler und Telegram im
          Zusatzlauf ausgeschaltet. Reguläre E2E-CI nutzt ihren eigenen Wegwerf-
          Compose-Stack mit bestehenden synthetischen Schreibfreigaben, nicht JMBbot.
          Python 3.12.15 und Frontend Node/npm 22.16.0/10.9.2. Eine AnyIO-
          BlockingPortal-DeprecationWarning und die bestehende Vite-Warnung zu Chunks
          über 500 kB bleiben sichtbar; kein warnungsfreier Lauf behauptet.

          Vollständiger credential-freier Quell-/Dependency-Export aus Zusatzlauf
          38613983711: Archivprüfsummen und b40-HEAD/Tree lokal abgeglichen, eigener
          Aufgabenbranch. Das ist jetzt ein vollständiger Quellbaum, aber nur shallow
          Git-Historie. Keine AGENTS.md im vollständigen verfolgten Baum gefunden.

          Der erste isolierte Browserlauf blieb durch `VITE_API_BASE_URL=/api` vor
          jedem API-Aufruf leer: Die bestehende Anwendung verlangt eine absolute
          HTTP(S)-URL. Ausschließlich Prüfaufbau korrigiert; Anwendung und Assertions
          unverändert. Danach alle drei Browserfälle grün. Die jobweite Browser-URL
          im Zusatzlauf beeinflusste außerdem 18 Unit-Assertions auf die Standard-URL
          (438 bestanden/18 fehlgeschlagen); dieser Frontend-Teil ist NICHT grün.
          Die oben genannte reguläre Frontend-CI lief mit Standardumgebung erfolgreich.
          Ein lokaler vollständiger Skriptversuch endete nach Typecheck während
          ESLint am Werkzeug-Zeitlimit und zählt nicht als bestandener Gesamtgate.

          Der frühere npm-ci-/sharp-Fehler war im separaten unveränderten main-
          Versuch ([38609444879](https://github.com/burckhju/trading-workspace/actions/runs/38609444879),
          `baseline-docker`) nicht reproduzierbar. Auch der neue reguläre E2E-Build
          ist grün. Keine Lockdatei, kein Image und keine Schwelle zur Erzwingung von
          Grün geändert; kein fortbestehender Lockfiledefekt behauptet.

          ### Offener fachlicher Schnitt

          Der vollständige Checkout bestätigt im FT-012-Owner Journalmodelle,
          Mapping und Evidence-Lesetypen, aber keinen Journal-Schreibservice,
          entsprechende UOW-Repositories, registrierte Schreibroute oder Editor.
          Der untenstehende Journal-Vertragsvorschlag ist keine fachliche Freigabe.
          Nächster Schnitt bleibt [PB-019 Journal](../planning/PRODUCT_BACKLOG.md#naechster-schnitt):
          Modell zu Commands, Persistenz, API und Entwurfsdialog verbinden;
          Abschlussinhalt, exakte Quellenbindung, Konkurrenz und Folgeversion vor
          der jeweiligen Änderung festlegen. Keine Performance-Zwangsvoraussetzung.

          Ebenfalls offen: historische Evidence-Anzeige bei NOT_READY, atomare
          Upstream-Korrekturabsicherung und vollständige Capture→Journal→Lesson-
          Korrekturstrecke. Keine neue Migration, Backfill, reale Ausführung,
          Nachricht, Modellaktivierung, Merge/Tag/Deployment oder Zielinstallations-
          beobachtung. Temporäre Prüfhilfe vor Übergabe aus dem PR entfernen.

          ---

          ## Historischer Erstnachweis — vor vollständiger Qualifikation

          Die folgenden Nicht-ausgeführt-Aussagen dokumentieren den ursprünglichen
          Teilrekonstruktionsstand. Nur die oben belegten Teilprüfungen sind inzwischen
          fortgeschrieben; frühere Prüfungen werden nicht rückwirkend als ausgeführt
          und der Gesamtprozess nicht als abgeschlossen ausgegeben.

          '''
          first, rest = texts[report].split('\n', 1)
          run = os.environ['EVIDENCE_RUN_ID']
          supplementary = f'Ergänzend ist `bash scripts/check-frontend.sh` in Standardumgebung auf b40 im erfolgreichen vorgeschalteten Job von [Run {run}](https://github.com/burckhju/trading-workspace/actions/runs/{run}) vollständig ausgeführt. Die Dokumentationsfortschreibung ändert keinen Anwendungscode.\n\n'
          addition = addition.replace('### Offener fachlicher Schnitt', supplementary + '### Offener fachlicher Schnitt')
          texts[report] = first + '\n\n' + addition + rest.lstrip('\n')

          path = 'docs/planning/PRODUCT_BACKLOG.md'
          source = texts[path]
          start = source.index('<a id="pb-019-materialization"></a>')
          end = source.index('<a id="pb-019-journal"></a>')
          block = source[start:end]
          block, count = re.subn(r'^> Nachweisfortschreibung 2026-10-14:.*$', '> Nachweisfortschreibung 2026-10-14: [vollständige Repository-Integration und abgegrenzte Qualifikation](../implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md) in Draft-PR #259 auf v1.5.6. b40: 2600 Backendtests einschließlich drei unabhängiger PostgreSQL-Fälle; dort bezeichneter 8f-Testmerge: 456 Frontendtests und 51 Browserfälle. Drei neue Browserfälle verwenden abgefangenes HTTP, keine vollständige Journal-/DB-Nutzerreise.', block, flags=re.M)
          assert count == 1
          replacements = {
              'Vorhandenseinsnachweis': 'Bestehender Materialisierungsowner plus additiver Review-Pin im vollständigen Entwicklungsbranch implementiert und begrenzt technisch geprüft; kein vollständiger Lernabschluss.',
              'Test / Commit': 'Konkrete Tests, Commits, Run-IDs, Coverage und Fehlversuche in der [technischen Fortschreibung](../implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md). b40: kompletter Backend-Prüfeinstieg, drei echte PostgreSQL-Transaktionsfälle. Reguläre Frontend-/Browser-CI auf Testmerge `173c952` von `8f2a423` erfolgreich. Spätere Heads separat prüfen.',
              'Restarbeit / nächste Abhängigkeit': 'Review des qualifizierten Teilschnitts, historische Evidence-Anzeige bei NOT_READY und atomare Absicherung gegen gleichzeitige Upstream-Korrektur bleiben offen. Journal und komplette Capture→Journal→Lesson-Korrekturstrecke sind nicht geliefert. **Nächste Abhängigkeit:** Bestehender FT-012-Journalvertrag; kein zweiter Materialisierungsweg.',
          }
          for field, value in replacements.items():
              block, count = re.subn(r'^\| ' + re.escape(field) + r' \|.*$', '| ' + field + ' | ' + value + ' |', block, flags=re.M)
              assert count == 1, field
          source = source[:start] + block + source[end:]
          source, count = re.subn(r'^> Bestandsnotiz 2026-10-14:.*$', '> Bestandsnotiz 2026-10-14: [vollständiger Checkout und Journal-Vertragsvorschlag](../implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md) bestätigen Journalmodelle und Evidence-Lesetypen, aber keinen Journal-Schreibservice, entsprechende UOW-Repositories, registrierte Schreibroute oder Editor im FT-012-Consumer. Die Domain erlaubt leere Finals und enthält dort keinen konkreten Review-Pin.', source, flags=re.M)
          assert count == 1
          texts[path] = source

          path = 'docs/foundation/TRACEABILITY.md'
          texts[path], count = re.subn(r'^> Nachweisergänzung 2026-10-14:.*$', '> Nachweisergänzung 2026-10-14: [integrierter Handoff-Teilschnitt, PostgreSQL-/Browserbelege und offene Journalstrecke](../implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md). Die Fortschreibung trennt Prüfcommits, echte DB-Transaktionen und abgefangenes Browser-HTTP. Arbeitsstatus ausschließlich im [zentralen Backlog](../planning/PRODUCT_BACKLOG.md#pb-019-materialization); keine Fach-/Betriebsabnahme.', texts[path], flags=re.M)
          assert count == 1

          path = 'docs/decisions/ADR-POST-FT012-004-FT011-EVIDENCE-MATERIALIZATION-OWNERSHIP.md'
          texts[path] = once(texts[path], 'Accepted decision into a new approval. Full technical review, PostgreSQL/browser\nqualification and business acceptance of this extension remain outstanding.', 'Accepted decision into a new approval. The 2026-10-14 followthrough qualifies\nthe bounded pin/replay/UI slice with real PostgreSQL transactions and intercepted\nbrowser HTTP tests. Business acceptance, the complete journal path and atomic\nserialization against upstream correction remain outstanding.')

          path = 'docs/implementation/POST_TRADE_LEARNING_HANDOFF_DOR.md'
          texts[path] += '\n## Nachweisfortschreibung nach Implementierung — 14.10.2026\n\nDie vorab festgelegten Kriterien bleiben unverändert. Spätere echte PostgreSQL-\nTransaktionsfälle und abgefangene Browser-HTTP-Fälle sind jetzt in der\n[technischen Fortschreibung](POST_TRADE_LEARNING_HANDOFF_REVIEW.md) mit konkreten\nCommits/Läufen belegt. Sie ersetzen weder die komplette Capture→Journal→Lesson-\nStrecke noch Fachabnahme. Journal und Upstream-Korrektur-Atomarität bleiben offen.\n'
          for name, value in texts.items():
              assert value.endswith('\n') and all(line.rstrip() == line for line in value.splitlines()), name
              Path(name).write_text(value)
          print('Exactly five hash-verified existing evidence documents updated; no application mutation.')
          PY
      - name: Verify exact changed-path allowlist and publish documentation on authorized dev branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              'docs/planning/PRODUCT_BACKLOG.md',
              'docs/foundation/TRACEABILITY.md',
              'docs/implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md',
              'docs/decisions/ADR-POST-FT012-004-FT011-EVIDENCE-MATERIALIZATION-OWNERSHIP.md',
              'docs/implementation/POST_TRADE_LEARNING_HANDOFF_DOR.md',
          }
          assert set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == expected
          PY
          git diff --check
          git diff --binary > "$RUNNER_TEMP/documentation-followthrough.patch"
          git add docs/planning/PRODUCT_BACKLOG.md docs/foundation/TRACEABILITY.md docs/implementation/POST_TRADE_LEARNING_HANDOFF_REVIEW.md docs/decisions/ADR-POST-FT012-004-FT011-EVIDENCE-MATERIALIZATION-OWNERSHIP.md docs/implementation/POST_TRADE_LEARNING_HANDOFF_DOR.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(learning): record qualified handoff slice and preserve journal scope'
          test "$(git ls-remote origin "refs/heads/$TASK_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TASK_BRANCH"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/documentation-identity.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-documentation-followthrough
          path: |
            ${{ runner.temp }}/documentation-followthrough.patch
            ${{ runner.temp }}/documentation-identity.txt
          retention-days: 7
          if-no-files-found: error
