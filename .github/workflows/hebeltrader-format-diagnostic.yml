name: Hebeltrader formatting diagnostic
on:
  push:
    branches: [feat/hebeltrader-rules-v1]
    paths: [.github/workflows/hebeltrader-format-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Print exact formatter diff without changing the repository
        working-directory: frontend
        run: |
          npx prettier --write src/features/trade_plan/pages/HebeltraderPanel.tsx src/features/trade_plan/pages/HebeltraderPanel.test.tsx
          git diff -- src/features/trade_plan/pages/HebeltraderPanel.tsx src/features/trade_plan/pages/HebeltraderPanel.test.tsx
      - name: Run new component tests
        working-directory: frontend
        run: npx vitest run src/features/trade_plan/pages/HebeltraderPanel.test.tsx
