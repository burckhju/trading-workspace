name: Journal qualification
on:
  push:
    branches: [dev/ft012-journal-write-20261014]
    paths: [.github/workflows/journal-qualification.yml]
permissions:
  contents: read
concurrency:
  group: journal-write-qualification
  cancel-in-progress: false
env:
  TRADING_WORKSPACE_MARKET_DATA__REFRESH__ENABLED: 'false'
  TRADING_WORKSPACE_POSITION_MONITORING__ENABLED: 'false'
  TRADING_WORKSPACE_NOTIFICATION__TELEGRAM__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__EODHD__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__VONTOBEL_MARKETS__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__STUTTGART_DELAYED__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__GETTEX_DELAYED__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__FRANKFURT__ENABLED: 'false'
jobs:
  integrate:
    if: github.ref == 'refs/heads/dev/ft012-journal-write-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.integrate.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Verify base, transport hash and exact allowed patch paths
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f .env
          test ! -f backend/.env
          test ! -f frontend/.env
          git fetch --no-tags origin 818d1d800f02bfe7478cefa89073643d655b7413
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root = pathlib.Path('.')
          base = '818d1d800f02bfe7478cefa89073643d655b7413'
          temporary = {'.github/workflows/journal-qualification.yml', *(f'.github/journal-parts/{i}.b64' for i in range(5))}
          prior = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          assert prior == temporary, prior
          encoded = ''.join((root / f'.github/journal-parts/{i}.b64').read_text().strip() for i in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7010d6205bc554cdf34545819f1e0f7851f474c83c6396918b8a570bc8eeccd1'
          allowed = set('''backend/app/features/learning/api/__init__.py
          backend/app/features/learning/api/journal_dependencies.py
          backend/app/features/learning/api/journal_router.py
          backend/app/features/learning/application/journal_retention.py
          backend/app/features/learning/application/journal_service.py
          backend/app/features/learning/domain/models.py
          backend/app/features/learning/persistence/journal_repository.py
          backend/app/features/learning/persistence/mapping.py
          backend/app/features/learning/persistence/models.py
          backend/app/features/learning/persistence/unit_of_work.py
          backend/app/features/post_trade/application/exit_review_service.py
          backend/app/features/trade_plan/api/delete_router.py
          backend/app/features/trade_plan/service/hard_delete.py
          backend/migrations/versions/20261014_0046_journal_write_contract.py
          docs/decisions/ADR-POST-FT012-005-JOURNAL-WRITE-LIFECYCLE.md
          docs/foundation/TRACEABILITY.md
          docs/implementation/FT012_JOURNAL_WRITE_DOR.md
          docs/planning/PRODUCT_BACKLOG.md
          frontend/src/features/learning/components/JournalEvidenceOrigin.tsx
          frontend/src/features/learning/components/TradeJournalPanel.test.tsx
          frontend/src/features/learning/components/TradeJournalPanel.tsx
          frontend/src/features/learning/pages/LessonDetailPage.tsx
          frontend/src/features/learning/services/journalClient.test.ts
          frontend/src/features/learning/services/journalClient.ts
          frontend/src/features/post_trade/pages/PostTradeLearningPage.test.tsx
          frontend/src/features/post_trade/pages/PostTradeLearningPage.tsx
          tests/e2e/post-trade-journal-postgres.spec.ts
          tests/e2e/support/seed_journal_prices.py
          tests/integration/backend/learning/test_journal_write_postgres.py
          tests/unit/backend/features/learning/test_journal_api.py
          tests/unit/backend/features/learning/test_journal_commands.py
          tests/unit/backend/features/post_trade/test_journal_source_inspection.py
          tests/unit/backend/features/trade_plan/test_hard_delete_api.py'''.splitlines())
          stats = subprocess.check_output(['git', 'apply', '--numstat'], input=patch).decode()
          assert {line.split('\t')[2] for line in stats.splitlines()} == allowed
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          subprocess.run(['git', 'rm', *sorted(temporary)], check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'c35e35bf8afb83675dac6044a0bc58c7ba390194', tree
          print('Verified journal patch, 33 permitted paths, complete tree:', tree)
          PY
      - name: Commit only verified journal slice and remove temporary transport
        id: integrate
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev/ft012-journal-write-20261014 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(learning): add explicit versioned trade journal with retained provenance'
          git push origin HEAD:refs/heads/dev/ft012-journal-write-20261014
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD HEAD^{tree}
  backend:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading_workspace
          POSTGRES_PASSWORD: journal-ci-only
          POSTGRES_DB: trading_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trading_workspace -d trading_workspace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRADING_WORKSPACE_DATABASE_URL: postgresql+asyncpg://trading_workspace:journal-ci-only@localhost:5432/trading_workspace_test
      TRADING_WORKSPACE_TEST_DATABASE_URL: postgresql+asyncpg://trading_workspace:journal-ci-only@localhost:5432/trading_workspace_test
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Verify disposable test target before writes
        run: |
          test "$GITHUB_ACTIONS" = 'true'
          test ! -f .env
          test ! -f backend/.env
          mkdir -p qualification
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ['TRADING_WORKSPACE_TEST_DATABASE_URL'])
          assert u.hostname == 'localhost' and u.port == 5432 and u.path == '/trading_workspace_test'
          PY
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Migrate disposable PostgreSQL and verify one head
        working-directory: backend
        run: |
          set -euo pipefail
          python -m alembic heads | tee ../qualification/heads.log
          python -m alembic upgrade head 2>&1 | tee ../qualification/migration.log
          python -m alembic current | tee ../qualification/current.log
          test "$(python -m alembic heads)" = '20261014_0046 (head)'
      - name: Journal unit and real PostgreSQL acceptance cases
        run: |
          set -euo pipefail
          python -m pytest -c backend/pyproject.toml tests/unit/backend/features/learning/test_journal_commands.py tests/unit/backend/features/learning/test_journal_api.py tests/unit/backend/features/post_trade/test_journal_source_inspection.py tests/unit/backend/features/trade_plan/test_hard_delete_api.py tests/integration/backend/learning/test_journal_write_postgres.py -vv 2>&1 | tee qualification/journal-targeted.log
      - name: Unmodified complete backend gate
        run: |
          set -euo pipefail
          bash scripts/check-backend.sh 2>&1 | tee qualification/backend-full.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-postgres-backend
          path: |
            qualification
            backend/coverage.xml
          retention-days: 7
  frontend:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm --prefix frontend ci
      - name: Unmodified complete frontend gate with standard environment
        run: |
          set -euo pipefail
          mkdir -p qualification
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          bash scripts/check-frontend.sh 2>&1 | tee qualification/frontend-full.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-frontend
          path: |
            qualification
            frontend/coverage
          retention-days: 7
  browser-postgres:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      POSTGRES_DB: trading_workspace_test
      POSTGRES_USER: trading_workspace
      POSTGRES_PASSWORD: journal-browser-ci-only
      POSTGRES_PORT: '25432'
      BACKEND_PORT: '28000'
      FRONTEND_PORT: '28080'
      E2E_POSTGRES_PORT: '25432'
      E2E_BACKEND_PORT: '28000'
      E2E_FRONTEND_PORT: '28080'
      E2E_PLAYWRIGHT_BASE_URL: http://127.0.0.1:28080
      E2E_VITE_API_BASE_URL: http://127.0.0.1:28080/api
      VITE_API_BASE_URL: http://127.0.0.1:28080/api
      TRADING_WORKSPACE_TEST_DATABASE_URL: postgresql+asyncpg://trading_workspace:journal-browser-ci-only@127.0.0.1:25432/trading_workspace_test
      JOURNAL_E2E_WRITES_ALLOWED: '1'
      TRADE_E2E_WRITES_ALLOWED: '1'
      CURRENCY_E2E_WRITES_ALLOWED: '1'
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Verify new runner has no existing project, credentials or user volumes
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = 'true'
          test ! -f .env
          test ! -f backend/.env
          test ! -f frontend/.env
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=trading-workspace-e2e)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=trading-workspace-e2e)"
          test ! -d docker/stuttgart-data
          mkdir -p qualification docker/stuttgart-data
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = urlparse(os.environ['TRADING_WORKSPACE_TEST_DATABASE_URL'])
          assert u.hostname == '127.0.0.1' and u.port == 25432 and u.path == '/trading_workspace_test'
          PY
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and migrate only the script's disposable project
        run: |
          set -euo pipefail
          docker compose --project-name trading-workspace-e2e -f docker/compose.yml up --build --wait --wait-timeout 180
          docker compose --project-name trading-workspace-e2e -f docker/compose.yml run --rm --no-deps -T backend python -m alembic upgrade head
      - name: Unmodified E2E entrypoint including actual journal PostgreSQL browser flow
        run: |
          set -euo pipefail
          bash scripts/run-e2e.sh 2>&1 | tee qualification/browser-full.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-real-browser-postgres
          path: |
            qualification
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Cleanup only this new disposable project
        if: always()
        run: docker compose --project-name trading-workspace-e2e -f docker/compose.yml down --volumes --remove-orphans
