name: Lesson evidence closeout
on:
  push:
    branches: [dev/ft012-lesson-review-20261015]
    paths: [.github/workflows/lesson-evidence-closeout.yml]
permissions:
  contents: read
jobs:
  document:
    if: github.ref == 'refs/heads/dev/ft012-lesson-review-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Update only reviewed documentation after completed green qualification
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          base='4081563509cb4ad4e765de499765a1759b59cdd3'
          helper='.github/workflows/lesson-evidence-closeout.yml'
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==[helper]
          encoded=''''''
          p=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(p).hexdigest()=='b620bdf316ba53d9e69cb52c75f37f919e6acd321255e8e85f6dcae85a423bf5'
          paths={'docs/decisions/ADR-POST-FT012-006-EXPLICIT-LESSON-REVIEW.md','docs/implementation/FT012_LESSON_REVIEW_DOR.md','docs/implementation/FT012_LESSON_REVIEW_QUALIFICATION.md','docs/foundation/TRACEABILITY.md','docs/planning/PRODUCT_BACKLOG.md'}
          assert {x.split('\t')[2] for x in subprocess.check_output(['git','apply','--numstat'],input=p).decode().splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=p,check=True)
          subprocess.run(['git','apply'],input=p,check=True)
          subprocess.run(['git','rm',helper],check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='17dc54967bac351ef7f9beafa406b2d64978572f'
          PY
          test "$(git ls-remote origin refs/heads/dev/ft012-lesson-review-20261015 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(learning): record qualified explicit lesson review and merge boundary'
          git push origin HEAD:refs/heads/dev/ft012-lesson-review-20261015
          mkdir -p "$RUNNER_TEMP/lesson-final-source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/lesson-final-source/identity.txt"
          git bundle create "$RUNNER_TEMP/lesson-final-source/source.bundle" HEAD
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-final-documentation-source
          path: ${{ runner.temp }}/lesson-final-source
          retention-days: 7
