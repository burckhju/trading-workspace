name: Lesson merge qualification
on:
  push:
    branches: [dev/ft012-lesson-review-20261015]
    paths: [.github/workflows/lesson-merge-qualification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8dbff08e56c507e9ca1726aef24ade80f3dd5563
          fetch-depth: 100
          persist-credentials: false
      - name: Export credential-free source and exact identity
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = 8dbff08e56c507e9ca1726aef24ade80f3dd5563
          test ! -f .env
          mkdir -p "$RUNNER_TEMP/lesson-source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/lesson-source/identity.txt"
          git ls-files '*AGENTS.md' | while IFS= read -r f; do echo "=== $f"; cat "$f"; done > "$RUNNER_TEMP/lesson-source/instructions.txt"
          git bundle create "$RUNNER_TEMP/lesson-source/source.bundle" HEAD
          cd "$RUNNER_TEMP/lesson-source"
          sha256sum source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-source-8dbff08
          path: ${{ runner.temp }}/lesson-source
          retention-days: 7
