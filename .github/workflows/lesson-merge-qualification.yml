name: Lesson merge qualification
on:
  push:
    branches: [dev/ft012-lesson-review-20261015]
    paths: [.github/workflows/lesson-merge-qualification.yml]
permissions:
  contents: read
concurrency:
  group: lesson-merge-qualification
  cancel-in-progress: false
env:
  TRADING_WORKSPACE_MARKET_DATA__REFRESH__ENABLED: 'false'
  TRADING_WORKSPACE_POSITION_MONITORING__ENABLED: 'false'
  TRADING_WORKSPACE_NOTIFICATION__TELEGRAM__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__EODHD__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__VONTOBEL_MARKETS__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__STUTTGART_DELAYED__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__GETTEX_DELAYED__ENABLED: 'false'
  TRADING_WORKSPACE_MARKET_DATA__FRANKFURT__ENABLED: 'false'
jobs:
  integrate:
    if: github.ref == 'refs/heads/dev/ft012-lesson-review-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.patch.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Verify reviewed patch and remove temporary transport before qualification
        id: patch
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f .env
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, re, subprocess
          base='8dbff08e56c507e9ca1726aef24ade80f3dd5563'
          helpers={'.github/lesson-merge-fix.b64','.github/workflows/lesson-merge-qualification.yml'}
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())==helpers
          p=lzma.decompress(base64.b64decode(pathlib.Path('.github/lesson-merge-fix.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(p).hexdigest()=='a46484614eaf2c8986ce43c1848f853b6f5f5dac5cb0ea5845d49b53fe9cdf68'
          paths={
            'docs/decisions/ADR-POST-FT012-006-EXPLICIT-LESSON-REVIEW.md',
            'docs/implementation/FT012_LESSON_REVIEW_DOR.md',
            'frontend/src/features/learning/components/EvidenceSourceStatus.test.tsx',
            'frontend/src/features/learning/components/LessonReviewPanel.test.tsx',
            'frontend/src/features/learning/components/LessonReviewPanel.tsx',
            'frontend/src/features/learning/services/lessonReviewClient.test.ts',
            'frontend/src/features/post_trade/pages/PostTradeReviewPage.test.tsx',
            'frontend/src/features/post_trade/pages/PostTradeReviewPage.tsx',
            'tests/integration/backend/learning/test_explicit_lesson_review_postgres.py',
            'tests/unit/backend/features/learning/test_evidence_source_inspection.py',
            'tests/unit/backend/features/learning/test_explicit_review_commands.py',
          }
          stats=subprocess.check_output(['git','apply','--numstat'],input=p).decode()
          assert {line.split('\t')[2] for line in stats.splitlines()}==paths
          subprocess.run(['git','apply','--check'],input=p,check=True)
          subprocess.run(['git','apply'],input=p,check=True)
          # Explicitly await resolution microtasks in React's asynchronous act overload.
          # This is the final locally linted/tested delta, not a lint suppression.
          expected={
            'frontend/src/features/learning/components/EvidenceSourceStatus.test.tsx':1,
            'frontend/src/features/learning/components/LessonReviewPanel.test.tsx':3,
            'frontend/src/features/post_trade/pages/PostTradeReviewPage.test.tsx':1,
          }
          for file,count in expected.items():
              path=pathlib.Path(file)
              s,n=re.subn(r'await act\(\(\) => \{\n(\s+(?:resolve|reject)\([^\n]*\);)\n(\s*)\}\);',lambda m:'await act(async () => {\n'+m[1]+'\n'+m[2]+'  await Promise.resolve();\n'+m[2]+'});',path.read_text())
              assert n==count,(file,n)
              path.write_text(s)
          subprocess.run(['git','rm',*sorted(helpers)],check=True)
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='59aed8a58ad2990459f172ac77554341db3cbaac'
          PY
          test "$(git ls-remote origin refs/heads/dev/ft012-lesson-review-20261015 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(learning): preserve review edits and uniquely label evidence relations'
          git push origin HEAD:refs/heads/dev/ft012-lesson-review-20261015
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD HEAD^{tree}
  backend:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading_workspace
          POSTGRES_PASSWORD: lesson-ci-only
          POSTGRES_DB: trading_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trading_workspace -d trading_workspace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRADING_WORKSPACE_DATABASE_URL: postgresql+asyncpg://trading_workspace:lesson-ci-only@localhost:5432/trading_workspace_test
      TRADING_WORKSPACE_TEST_DATABASE_URL: postgresql+asyncpg://trading_workspace:lesson-ci-only@localhost:5432/trading_workspace_test
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Verify fresh disposable database context
        run: |
          test "$GITHUB_ACTIONS" = true
          test ! -f .env
          test ! -f backend/.env
          mkdir -p qualification
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u=urlparse(os.environ['TRADING_WORKSPACE_TEST_DATABASE_URL'])
          assert u.hostname=='localhost' and u.port==5432 and u.path=='/trading_workspace_test'
          PY
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Migrate real PostgreSQL and verify existing schema head
        working-directory: backend
        run: |
          set -euo pipefail
          python -m alembic upgrade head 2>&1 | tee ../qualification/migration.log
          python -m alembic current | tee ../qualification/current.log
          test "$(python -m alembic heads)" = '20261014_0046 (head)'
      - name: Explicit review and actual PostgreSQL acceptance
        run: |
          set -euo pipefail
          python -m pytest -c backend/pyproject.toml tests/unit/backend/features/learning/test_explicit_review_commands.py tests/unit/backend/features/learning/test_evidence_source_inspection.py tests/integration/backend/learning/test_explicit_lesson_review_postgres.py -vv 2>&1 | tee qualification/targeted.log
      - name: Unchanged complete backend gate
        if: always()
        run: |
          set -euo pipefail
          bash scripts/check-backend.sh 2>&1 | tee qualification/backend-full.log
          cd backend
          test "$(python -m alembic heads)" = '20261014_0046 (head)'
          python -m alembic current | tee ../qualification/current-after.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-corrected-backend
          path: |
            qualification
            backend/coverage.xml
          retention-days: 7
  frontend:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm --prefix frontend ci
      - name: Focused review regressions
        run: |
          set -euo pipefail
          mkdir -p qualification
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          cd frontend
          npx vitest run src/features/learning/components/LessonReviewPanel.test.tsx src/features/learning/components/EvidenceSourceStatus.test.tsx src/features/learning/services/lessonReviewClient.test.ts src/features/post_trade/pages/PostTradeReviewPage.test.tsx 2>&1 | tee ../qualification/targeted.log
      - name: Unchanged complete frontend gate without browser environment overrides
        if: always()
        run: |
          set -euo pipefail
          bash scripts/check-frontend.sh 2>&1 | tee qualification/frontend-full.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-corrected-frontend
          path: |
            qualification
            frontend/coverage
          retention-days: 7
  browser-postgres:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      POSTGRES_DB: trading_workspace_test
      POSTGRES_USER: trading_workspace
      POSTGRES_PASSWORD: lesson-browser-ci-only
      POSTGRES_PORT: '25432'
      BACKEND_PORT: '8000'
      FRONTEND_PORT: '8080'
      E2E_POSTGRES_PORT: '25432'
      E2E_BACKEND_PORT: '8000'
      E2E_FRONTEND_PORT: '8080'
      E2E_PLAYWRIGHT_BASE_URL: http://localhost:8080
      PLAYWRIGHT_BASE_URL: http://localhost:8080
      E2E_VITE_API_BASE_URL: http://localhost:8080/api
      VITE_API_BASE_URL: http://localhost:8080/api
      TRADING_WORKSPACE_TEST_DATABASE_URL: postgresql+asyncpg://trading_workspace:lesson-browser-ci-only@localhost:25432/trading_workspace_test
      JOURNAL_E2E_WRITES_ALLOWED: '1'
      TRADE_E2E_WRITES_ALLOWED: '1'
      CURRENCY_E2E_WRITES_ALLOWED: '1'
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Verify exclusive new Compose project and ports before writes
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test ! -f .env
          test ! -f backend/.env
          test ! -f frontend/.env
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=trading-workspace-e2e)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=trading-workspace-e2e)"
          test ! -d docker/stuttgart-data
          mkdir -p qualification docker/stuttgart-data
          git rev-parse HEAD HEAD^{tree} | tee qualification/identity.txt
          python - <<'PY'
          import os,socket
          from urllib.parse import urlparse
          u=urlparse(os.environ['TRADING_WORKSPACE_TEST_DATABASE_URL'])
          assert u.hostname=='localhost' and u.port==25432 and u.path=='/trading_workspace_test'
          for port in (25432,8000,8080):
              with socket.socket() as s:s.bind(('127.0.0.1',port))
          PY
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and migrate only the verified disposable project
        run: |
          set -euo pipefail
          docker compose --project-name trading-workspace-e2e -f docker/compose.yml up --build --wait --wait-timeout 180
          docker compose --project-name trading-workspace-e2e -f docker/compose.yml run --rm --no-deps -T backend python -m alembic upgrade head
      - name: Real journal and lesson successor twice without retries
        working-directory: frontend
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: |
          set -euo pipefail
          npx playwright test post-trade-journal-postgres.spec.ts --trace on --repeat-each=2 --retries=0 2>&1 | tee ../qualification/browser-targeted.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-corrected-browser-targeted
          path: |
            qualification
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Unchanged complete E2E gate including previous regressions
        if: always()
        run: |
          set -euo pipefail
          bash scripts/run-e2e.sh 2>&1 | tee qualification/browser-full.log
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-corrected-browser-full
          path: |
            qualification
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Cleanup only the newly owned disposable project
        if: always()
        run: docker compose --project-name trading-workspace-e2e -f docker/compose.yml down --volumes --remove-orphans
