name: Position history development export
on:
  push:
    branches: [docs/position-price-history-readiness]
    paths: [.github/workflows/position-history-development-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export public Git objects and pinned integration source only
        run: |
          mkdir -p /tmp/position-history-source
          git bundle create /tmp/position-history-source/repository.bundle --all
          git archive --format=tar 36928cd08f6705033affa73a0d556535ec686fa5 > /tmp/position-history-source/source.tar
          git rev-parse 36928cd08f6705033affa73a0d556535ec686fa5^{tree} > /tmp/position-history-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: position-history-source-current
          path: /tmp/position-history-source
          retention-days: 1
          if-no-files-found: error
