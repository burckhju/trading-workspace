name: Position history PostgreSQL development
on:
  push:
    branches: [docs/position-price-history-readiness]
    paths: [.github/workflows/position-history-postgres-development.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Package installed PostgreSQL tools without any database contents
        shell: bash
        run: |
          set -euo pipefail
          version=$(find /usr/lib/postgresql -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          test -x "/usr/lib/postgresql/$version/bin/postgres"
          mkdir -p /tmp/pg-development/pgsql /tmp/pg-development/deps
          cp -a "/usr/lib/postgresql/$version/bin" /tmp/pg-development/pgsql/
          cp -a "/usr/lib/postgresql/$version/lib" /tmp/pg-development/pgsql/
          cp -a "/usr/share/postgresql/$version" /tmp/pg-development/pgsql/share
          for binary in /usr/lib/postgresql/$version/bin/* /usr/lib/postgresql/$version/lib/*.so; do
            ldd "$binary" 2>/dev/null | awk '/=> \/.* \(/ {print $3}' || true
          done | sort -u | while read -r library; do
            case "$library" in
              */libc.so.*|*/libm.so.*|*/libpthread.so.*|*/librt.so.*|*/libdl.so.*) continue;;
            esac
            cp -L "$library" /tmp/pg-development/deps/
          done
          tar -czf /tmp/postgresql-development.tar.gz -C /tmp/pg-development .
      - uses: actions/upload-artifact@v4
        with:
          name: position-history-postgres-development
          path: /tmp/postgresql-development.tar.gz
          retention-days: 1
          if-no-files-found: error
