name: Positions review source export
on:
  push:
    branches: [chore/positions-review-export]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive reviewed feature commit only
        run: |
          test "$(git rev-parse HEAD^)" = "47df9191d1e231112539052c9f0615e054ce7504" || git fetch --depth=1 origin 47df9191d1e231112539052c9f0615e054ce7504
          git archive --format=tar 47df9191d1e231112539052c9f0615e054ce7504 > source.tar
          git rev-parse 47df9191d1e231112539052c9f0615e054ce7504^{tree} > tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: positions-review-source
          path: |
            source.tar
            tree.txt
          retention-days: 1
