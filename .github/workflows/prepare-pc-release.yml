name: Prepare PC release
on:
  push:
    branches: [release/v1.5.7-pc-learning-20261016]
    paths: [.github/workflows/prepare-pc-release.yml]
permissions:
  contents: read
concurrency:
  group: prepare-pc-release-157
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/release/v1.5.7-pc-learning-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Verify reviewed base and prepare only version metadata
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f .env
          test "$(node --version)" = v22.16.0
          test "$(npm --version)" = 10.9.2
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          base='ccb586665217b113341e32cefe8a732f1ac9531d'
          assert subprocess.check_output(['git','rev-parse',base+'^{tree}'],text=True).strip()=='17dc54967bac351ef7f9beafa406b2d64978572f'
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())=={'.github/workflows/prepare-pc-release.yml','docs/releases/V1.5.7-POST-TRADE-JOURNAL-LEARNING.md'}
          assert hashlib.sha256(pathlib.Path('docs/releases/V1.5.7-POST-TRADE-JOURNAL-LEARNING.md').read_bytes()).hexdigest()=='ce2260638d58515e6f3e70b4b982397a923667b272f97135c33d9eb50dd9ba65'
          p=pathlib.Path('VERSION'); assert p.read_text()=='1.5.6\n'; p.write_text('1.5.7\n')
          p=pathlib.Path('backend/pyproject.toml'); s=p.read_text(); assert s.count('version = "1.5.6"')==1; p.write_text(s.replace('version = "1.5.6"','version = "1.5.7"'))
          PY
          npm --prefix frontend version 1.5.7 --no-git-tag-version --ignore-scripts --offline
          git rm .github/workflows/prepare-pc-release.yml
          git add VERSION backend/pyproject.toml frontend/package.json frontend/package-lock.json
          git diff --cached --check
          test "$(git write-tree)" = 8e30df4fcfe48f2b9579da86202d27802643b6de
          node --test .github/tests/version-tag.test.cjs
          test "$(git ls-remote origin refs/heads/release/v1.5.7-pc-learning-20261016 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(release): prepare v1.5.7 PC journal and learning update'
          git push origin HEAD:refs/heads/release/v1.5.7-pc-learning-20261016
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
