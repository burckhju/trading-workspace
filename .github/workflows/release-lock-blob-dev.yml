name: Prepare pinned release lock blob
on:
  push:
    branches: [dev/release-v153-lock-blob-20261011]
    paths: [.github/workflows/release-lock-blob-dev.yml]
permissions: {}
jobs:
  blob:
    if: github.repository == 'burckhju/trading-workspace' && github.ref == 'refs/heads/dev/release-v153-lock-blob-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create only the verified unreferenced public lockfile blob
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            const sourceSha = 'e58ec87d77f986c35f8b55bb845ab6ce0ab43cdb';
            const expectedSha = '304637bdc4c0f4ca4c004701fb79424bef875048';
            const source = await github.rest.git.getBlob({ owner, repo, file_sha: sourceSha });
            assert.equal(source.data.encoding, 'base64');
            const before = Buffer.from(source.data.content, 'base64').toString('utf8');
            const parts = before.split('"version": "1.5.2"');
            assert.equal(parts.length, 3, 'Exactly two root version fields must change.');
            const after = parts.join('"version": "1.5.3"');
            const original = JSON.parse(before);
            const candidate = JSON.parse(after);
            assert.equal(candidate.version, '1.5.3');
            assert.equal(candidate.packages[''].version, '1.5.3');
            candidate.version = original.version;
            candidate.packages[''].version = original.packages[''].version;
            assert.deepEqual(candidate, original, 'Dependencies and integrity fields must not change.');
            const bytes = Buffer.from(after, 'utf8');
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),
              '07ebe7291219e6834138fa602f3b18d6bdc39b7bac12d2bde388bef848a9ff55');
            assert.equal(crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex'), expectedSha);
            const result = await github.rest.git.createBlob({ owner, repo, content: after, encoding: 'utf-8' });
            assert.equal(result.data.sha, expectedSha);
            core.notice(`Verified unreferenced lockfile blob: ${result.data.sha}. No branches, tags or releases changed.`);
