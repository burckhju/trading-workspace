name: Prepare v1.5.26 version blobs
on:
  push:
    branches: [dev/release-v1526-metadata-20261027]
    paths: [.github/workflows/release-v1526-prepare.yml]
permissions: {}
jobs:
  metadata:
    if: github.repository == 'burckhju/trading-workspace' && github.ref == 'refs/heads/dev/release-v1526-metadata-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 38fd60cee441404546e2d3b9a3ca8555e3b2f323
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Generate package versions with the repository npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.16.0
          test "$(npm --version)" = 10.9.2
          test "$(git rev-parse HEAD)" = 38fd60cee441404546e2d3b9a3ca8555e3b2f323
          test "$(git hash-object frontend/package-lock.json)" = d73fda24849f8d72a3f85ee35eefc1006b003173
          test "$(cat VERSION)" = 1.5.25
          npm --prefix frontend version 1.5.26 --no-git-tag-version --ignore-scripts --offline
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/pyproject.toml')
          before = path.read_text()
          assert before.count('\nversion = "1.5.25"\n') == 1
          path.write_text(before.replace('\nversion = "1.5.25"\n', '\nversion = "1.5.26"\n'))
          Path('VERSION').write_text('1.5.26\n')
          PY
          git diff --check
          node --test .github/tests/version-tag.test.cjs
      - name: Verify scope and store only unreferenced version blobs
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            const { owner, repo } = context.repo;
            const paths = ['VERSION', 'backend/pyproject.toml', 'frontend/package-lock.json', 'frontend/package.json'].sort();
            const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').sort();
            assert.deepEqual(changed, paths);
            const manifest = [];
            for (const path of paths) {
              const before = execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' });
              const after = fs.readFileSync(path, 'utf8');
              if (path.endsWith('.json')) {
                const original = JSON.parse(before);
                const candidate = JSON.parse(after);
                assert.equal(original.version, '1.5.25');
                assert.equal(candidate.version, '1.5.26');
                candidate.version = original.version;
                if (path.includes('package-lock')) {
                  assert.equal(original.packages[''].version, '1.5.25');
                  assert.equal(candidate.packages[''].version, '1.5.26');
                  candidate.packages[''].version = original.packages[''].version;
                }
                assert.deepEqual(candidate, original, `Dependencies changed: ${path}`);
                let expected = before.replace(/^  "version": "1\.5\.25",$/m, '  "version": "1.5.26",');
                if (path.includes('package-lock')) {
                  expected = expected.replace(/^      "version": "1\.5\.25",$/m, '      "version": "1.5.26",');
                }
                assert.equal(after, expected, `Unexpected formatting or other changes: ${path}`);
              } else if (path === 'VERSION') {
                assert.equal(before, '1.5.25\n');
                assert.equal(after, '1.5.26\n');
              } else {
                assert.equal(after, before.replace('\nversion = "1.5.25"\n', '\nversion = "1.5.26"\n'));
              }
              const bytes = Buffer.from(after, 'utf8');
              const expected = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
              const result = await github.rest.git.createBlob({ owner, repo, content: after, encoding: 'utf-8' });
              assert.equal(result.data.sha, expected);
              manifest.push({ path, sha: result.data.sha, sha256: crypto.createHash('sha256').update(bytes).digest('hex') });
            }
            core.notice(`VERSION_BLOBS=${JSON.stringify(manifest)}`);
            core.notice('Only four unreferenced metadata blobs created. No ref, tag, release, runtime, database, provider or notification changed.');
