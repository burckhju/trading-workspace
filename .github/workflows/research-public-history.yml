name: Research public history

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/research/**'
      - '.github/workflows/research-public-history.yml'

permissions:
  contents: read

concurrency:
  group: research-public-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    name: Research / public data only
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'research/hebeltrader-history-run-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector without network
        run: python -m unittest discover -s scripts/research -p 'test_*.py' -v
      - name: Acquire fixed-cutoff public histories
        run: >-
          python scripts/research/collect_public_history.py
          --symbols scripts/research/public_symbols.json
          --start 2024-10-01 --end 2026-09-11
          --output research-data
      - name: Requery actual null sessions and obtain child-company history
        run: python scripts/research/repair_public_sessions.py research-data
      - name: Return raw responses and audit trail even for an incomplete download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-public-history-${{ github.run_id }}
          path: research-data/
          retention-days: 3
          if-no-files-found: warn

# No stored secrets, .env, recommendations, broker connection, model mutation or schedule.
# Acquisition success alone does not certify currency, listing identity, corporate
# actions, full study coverage, strategy performance or production activation.
