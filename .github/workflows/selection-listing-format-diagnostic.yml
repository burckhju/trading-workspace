name: Listing regression formatting diagnostic
on:
  push:
    branches: [fix/warrant-listing-optional-symbol-ui]
    paths: [.github/workflows/selection-listing-format-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format isolated regression copy
        run: npx --no-install prettier --write src/features/product/services/symbolLessListing.test.ts
        working-directory: frontend
      - name: Show exact formatting delta
        run: git diff -- frontend/src/features/product/services/symbolLessListing.test.ts
      - name: Exercise regression against actual client
        run: npx --no-install vitest run src/features/product/services/symbolLessListing.test.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-formatted-regression
          path: frontend/src/features/product/services/symbolLessListing.test.ts
          if-no-files-found: error
