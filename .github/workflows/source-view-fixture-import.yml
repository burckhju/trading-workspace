name: Import verified native fixture corrections
on:
  push:
    branches: [transport/trade-source-import-7b8ab34]
    paths: [.github/workflows/source-view-fixture-import.yml]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'burckhju/trading-workspace'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch and exact commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          payload = base64.b64decode('')
          assert len(payload) == 1556 and hashlib.sha256(payload).hexdigest() == 'ed06c31c34d0e495335a65baeb552ff00685e42d549953d2210f86c8291445bf'
          d = lzma.LZMADecompressor()
          patch = d.decompress(payload, max_length=4918)
          assert d.eof and not d.unused_data and len(patch) == 4917
          assert hashlib.sha256(patch).hexdigest() == '909f4150aaa990bf130724fce9a1970c592fb8d4fb852a3ec01b46b510c98c03'
          base = '5e90a180db268abfe82dc1b12b9f6c098ba79fc4'
          tree = '6edfd4628e671890f1a340efffc46dd04ce55cfc'
          head = '8cc68f65d9b32d8337cfb32c468f0deeaa41b32a'
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          work = root / 'fixture-import'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(work), base], check=True)
          def git(*args, data=None):
              return subprocess.check_output(['git','-C',str(work),*args], input=data).decode().strip()
          git('apply','--check','--index','-', data=patch)
          git('apply','--index','-', data=patch)
          assert set(git('diff','--cached','--name-only').splitlines()) == {'tests/e2e/support/trade_source_journey.ts','tests/integration/backend/test_trade_source_view_postgres.py'}
          git('diff','--cached','--check')
          assert git('write-tree') == tree
          raw = (f'tree {tree}\nparent {base}\nauthor AI development assistant <noreply@example.invalid> 1792607693 +0000\ncommitter AI development assistant <noreply@example.invalid> 1792607739 +0000\n\ntest(trade): honor existing currency and lesson contracts in native fixtures\n').encode()
          assert git('hash-object','-t','commit','-w','--stdin',data=raw) == head
          print('Verified exact fixture correction', head, tree)
          PY
      - name: Publish new staging reference only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=https://github.com/burckhju/trading-workspace.git
          target=refs/heads/transport/source-fixtures-ready
          test -z "$(git ls-remote "$repo" "$target")"
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push "$repo" "8cc68f65d9b32d8337cfb32c468f0deeaa41b32a:$target"
          test "$(git ls-remote "$repo" "$target" | cut -f1)" = 8cc68f65d9b32d8337cfb32c468f0deeaa41b32a
