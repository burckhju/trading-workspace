name: Source view recovery transport

on:
  push:
    branches: [feature/trade-result-source-view]
    paths: [.github/workflows/source-view-recovery-transport.yml]

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and archive committed source only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = burckhju/trading-workspace
          test "$GITHUB_REF" = refs/heads/feature/trade-result-source-view
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 5e9ede2dc29f52eaff601d30614df6bc9c25c426 HEAD
          test "$(git show 5e9ede2dc29f52eaff601d30614df6bc9c25c426:VERSION)" = 1.5.11
          mkdir -p "$RUNNER_TEMP/source-view-recovery"
          git bundle create "$RUNNER_TEMP/source-view-recovery/source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/source-view-recovery/source.bundle"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-view-recovery/identity.txt"
          git ls-tree -r --name-only HEAD | grep -E '(^|/)AGENTS\.md$' > "$RUNNER_TEMP/source-view-recovery/agent-paths.txt" || test "$?" = 1
          cd "$RUNNER_TEMP/source-view-recovery"
          sha256sum source.bundle identity.txt agent-paths.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-view-recovery-base
          path: ${{ runner.temp }}/source-view-recovery/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prepare offline tools from unchanged manifests
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.16.0
          test "$(npm --version)" = 10.9.2
          mkdir -p "$RUNNER_TEMP/source-view-tools/wheels"
          python -m pip download --requirement backend/requirements-dev.txt --dest "$RUNNER_TEMP/source-view-tools/wheels"
          npm ci --prefix frontend
          test -z "$(git status --porcelain --untracked-files=no)"
          tar -czf "$RUNNER_TEMP/source-view-tools/python312.tar.gz" -C "$pythonLocation" .
          tar -czf "$RUNNER_TEMP/source-view-tools/node_modules.tar.gz" -C frontend node_modules
          cd "$RUNNER_TEMP/source-view-tools"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-view-recovery-toolchain
          path: ${{ runner.temp }}/source-view-tools/
          if-no-files-found: error
          retention-days: 7
