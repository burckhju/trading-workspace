name: Telegram name development source export
on:
  push:
    branches: [fix/telegram-warrant-name]
    paths: [.github/workflows/telegram-name-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download development wheels only
        run: python -m pip download --only-binary=:all: --dest /tmp/telegram-name-tools ruff==0.15.1 black==26.1.0 mypy==1.19.1 asyncpg==0.31.0
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-name-validation-tools
          path: /tmp/telegram-name-tools/
          retention-days: 1
