name: Trade repair diagnostics
on:
  push:
    branches: [fix/duplicate-trade-cancellation]
    paths: [.github/workflows/trade-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install black==26.1.0
      - name: Prepare reviewed repairs without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, urllib.request
          def edit(path, old, new):
              p=Path(path); s=p.read_text(); assert old in s, (path,old); p.write_text(s.replace(old,new))
          edit('backend/app/features/trade_position/persistence/repositories.py',
              '            .with_for_update()\n        )\n        if product is None:',
              '            # Serialize creators while remaining compatible with FK KEY SHARE locks\n            # already held by raw/imported trade rows in concurrent transactions.\n            .with_for_update(key_share=True)\n        )\n        if product is None:')
          edit('backend/migrations/versions/20260912_0036_trade_capture_safety.py',
              'PERFORM 1 FROM warrants WHERE id = NEW.product_id AND workspace_id = parent.workspace_id FOR UPDATE;',
              '-- FK inserts already hold KEY SHARE on this row. NO KEY UPDATE still\n    -- serializes creators, without mutually upgrading those FK locks.\n    PERFORM 1 FROM warrants WHERE id = NEW.product_id AND workspace_id = parent.workspace_id FOR NO KEY UPDATE;')
          edit('tests/integration/backend/database/conftest.py','CURRENT_HEAD = "20260828_0029"','CURRENT_HEAD = "head"')
          edit('tests/integration/backend/learning/conftest.py','from alembic.config import Config','from alembic.config import Config\nfrom alembic.script import ScriptDirectory')
          current='EXPECTED_ALEMBIC_HEAD = ScriptDirectory.from_config(\n    Config(str(Path(__file__).resolve().parents[4] / "backend" / "alembic.ini"))\n).get_current_head()\nassert EXPECTED_ALEMBIC_HEAD is not None'
          edit('tests/integration/backend/learning/conftest.py','EXPECTED_ALEMBIC_HEAD = "20260828_0029"',current)
          edit('tests/integration/backend/learning/test_learning_postgres_fixture.py','from sqlalchemy.ext.asyncio import AsyncEngine, AsyncSession','from sqlalchemy.ext.asyncio import AsyncEngine, AsyncSession\nfrom tests.integration.backend.learning.conftest import EXPECTED_ALEMBIC_HEAD')
          edit('tests/integration/backend/learning/test_learning_postgres_fixture.py','assert revision == "20260828_0029"','assert revision == EXPECTED_ALEMBIC_HEAD')
          edit('tests/integration/backend/post_trade/conftest.py','import pytest_asyncio\n','import pytest_asyncio\nfrom alembic.config import Config\nfrom alembic.script import ScriptDirectory\n')
          edit('tests/integration/backend/post_trade/conftest.py','EXPECTED_ALEMBIC_HEAD = "20260828_0029"',current)
          edit('tests/integration/backend/post_trade/test_postgres_fixture.py','from sqlalchemy.ext.asyncio import AsyncEngine, AsyncSession','from sqlalchemy.ext.asyncio import AsyncEngine, AsyncSession\nfrom tests.integration.backend.post_trade.conftest import EXPECTED_ALEMBIC_HEAD')
          edit('tests/integration/backend/post_trade/test_postgres_fixture.py','assert revision == "20260828_0029"','assert revision == EXPECTED_ALEMBIC_HEAD')
          edit('tests/integration/backend/test_trade_capture_safety.py',"'STOP_BREACHED'","'STOP_REACHED'")
          edit('tests/e2e/ft010-trade-management.spec.ts','  await page.getByLabel("Ausführungszeit").fill("2026-08-17T09:30");','  await page.getByLabel("Verkaufsdatum", { exact: true }).fill("2026-08-17");\n  await page.getByLabel("Verkaufsdatum Uhrzeit").fill("09:30");')
          p=Path('tests/integration/backend/database/test_scheduled_market_data_postgres.py');s=p.read_text()
          s=s.replace('_run_alembic("upgrade", "head", isolated_url)', '_run_alembic("upgrade", "20260912_0035", isolated_url)')
          start=s.index('                    # Held products outrank UUID order;')
          end=s.index('                    warrants, stocks = await read_catalog',start)
          legacy=s[start:end]
          s=s[:start]+'                    # Legacy duplicates add no jobs, and foreign-workspace positions\n                    # do not confer priority after the current migration is applied.\n'+s[end:]
          legacy='\n'.join(line[4:] if line.startswith('    ') else line for line in legacy.splitlines())+'\n'
          marker='                @asynccontextmanager\n                async def session_context():'
          assert marker in s
          s=s.replace(marker,legacy+'\n                # These deliberate legacy anomalies were possible before 0036. Commit\n                # them in this disposable database, then run the real upgrade. Never\n                # disable the runtime guard to manufacture new invalid trades.\n                await transaction.commit()\n                await asyncio.to_thread(_run_alembic, "upgrade", "head", current_database_url)\n                transaction = await connection.begin()\n\n'+marker)
          p.write_text(s)
          edit('docs/trade-capture-safety.md',"The initial guard locks the workspace's warrant row.","The initial guard takes `FOR NO KEY UPDATE` on the workspace's warrant row.\nThis lock serializes creators but is compatible with foreign-key `KEY SHARE` locks\nalready acquired by concurrent raw trade inserts; `FOR UPDATE` would deadlock on\nthose lock upgrades.")
          git=lambda *args: subprocess.check_output(['git',*args],text=True).strip()
          changed=git('diff','--name-only','HEAD').splitlines()
          subprocess.run(['python','-m','black','--config','backend/pyproject.toml',*[n for n in changed if n.endswith('.py')]],check=True)
          Path('.github/workflows/trade-diagnostic.yml').unlink()
          subprocess.run(['git','add','-u'],check=True)
          expected='7dcdf733989f7bab35380616617aeae3e06adcaa'
          actual=git('write-tree')
          assert actual == expected, (actual,expected)
          def post(endpoint,payload):
              req=urllib.request.Request('https://api.github.com/repos/burckhju/trading-workspace/git/'+endpoint,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as res: return json.load(res)
          entries=[]
          for name in git('diff','--cached','--name-only','HEAD').splitlines():
              path=Path(name)
              sha=post('blobs',{'content':path.read_text(),'encoding':'utf-8'})['sha'] if path.exists() else None
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=post('trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']
          assert tree == expected
          Path('/tmp/trade-repair-tree.json').write_text(json.dumps({'tree':tree,'parent':git('rev-parse','HEAD'),'files':entries},indent=2))
          print('Prepared verified tree:',tree,'No commit or branch ref updated.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trade-repair-tree
          path: /tmp/trade-repair-tree.json
          retention-days: 1
