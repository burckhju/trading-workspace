name: Trade safety source snapshot
on:
  push:
    branches: [fix/single-open-warrant-trade]
    paths: [.github/workflows/trade-safety-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz HEAD > /tmp/trade-safety-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: trade-safety-source
          path: /tmp/trade-safety-source.tar.gz
          retention-days: 1
