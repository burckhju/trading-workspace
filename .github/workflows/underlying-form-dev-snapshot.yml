name: Underlying form development snapshot

on:
  push:
    branches: [dev/underlying-form-validation-20261010]
    paths: [.github/workflows/underlying-form-dev-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0fa6797f4054e1c29f05526ac594b936f0737df
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Install locked public frontend test dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export public source and test dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/form-snapshot"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/form-snapshot/source.tar.gz"
          tar -czf "$RUNNER_TEMP/form-snapshot/frontend-dependencies.tar.gz" frontend/node_modules
          git rev-parse HEAD > "$RUNNER_TEMP/form-snapshot/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/form-snapshot/tree.txt"
          cd "$RUNNER_TEMP/form-snapshot"
          sha256sum source.tar.gz frontend-dependencies.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: underlying-form-source-d0fa6797
          path: ${{ runner.temp }}/form-snapshot/
          if-no-files-found: error
          retention-days: 3
