name: Version tag

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Backend, Frontend, End-to-End]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: version-tag
  cancel-in-progress: false

jobs:
  validate:
    name: Version / publication guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test version publication boundaries
        run: node --test .github/tests/version-tag.test.cjs

  tag:
    needs: validate
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Tag the current main version only after all project workflows succeeded
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.data.object.sha !== sha) {
              core.info('A newer main exists; leave version publication to its checks.');
              return;
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: sha, branch: 'main', event: 'push', per_page: 100,
            });
            for (const path of ['backend.yml', 'frontend.yml', 'e2e.yml']) {
              const matching = runs.filter(run => run.path === `.github/workflows/${path}`)
                .sort((a, b) => b.id - a.id);
              if (!matching.length || matching[0].status !== 'completed' ||
                  matching[0].conclusion !== 'success') {
                core.info(`Waiting for successful ${path} at ${sha}.`);
                return;
              }
            }
            const versionFile = await github.rest.repos.getContent({
              owner, repo, path: 'VERSION', ref: sha,
            });
            const version = Buffer.from(versionFile.data.content, 'base64').toString('utf8').trim();
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error('VERSION must contain a release version in major.minor.patch form.');
            }
            const tag = `v${version}`;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`${tag} already exists; published tags are never moved.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            core.info(`Published ${tag} at fully tested main ${sha}.`);
