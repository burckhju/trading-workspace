name: Warrant listing development tools
on:
  push:
    branches: [dev/warrant-listing-check-tools-20261010]
    paths: [.github/workflows/warrant-listing-dev-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public development wheels only
        run: |
          mkdir -p "$RUNNER_TEMP/listing-tools"
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/listing-tools" black==26.1.0 ruff==0.15.1 mypy==1.19.1 asyncpg==0.31.0
          cd "$RUNNER_TEMP/listing-tools"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: warrant-listing-public-tools-py313
          path: ${{ runner.temp }}/listing-tools/
          retention-days: 3
          if-no-files-found: error
