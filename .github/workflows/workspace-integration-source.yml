name: Workspace integration source snapshot
on:
  push:
    branches: [fix/workspace-action-names-integration]
    paths: [.github/workflows/workspace-integration-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e001d7c68dad7e50fa3e42e4e2a50500edc69b9d
          persist-credentials: false
      - name: Archive tracked development source only
        run: |
          mkdir -p /tmp/workspace-integration-source
          git archive --format=tar HEAD > /tmp/workspace-integration-source/source.tar
          git rev-parse HEAD HEAD^{tree} > /tmp/workspace-integration-source/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-integration-source-e001d7c
          path: /tmp/workspace-integration-source/
          retention-days: 1
