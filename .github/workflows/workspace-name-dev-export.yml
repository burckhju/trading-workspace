name: Workspace name isolated development export
on:
  push:
    branches: [fix/workspace-action-product-names]
    paths: [.github/workflows/workspace-name-dev-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b344855d56e8add972d2459d5a15c32c8e9c230
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Archive public tracked source and locked frontend dependencies
        run: |
          mkdir -p /tmp/workspace-name-dev
          git archive --format=tar HEAD > /tmp/workspace-name-dev/source.tar
          git rev-parse HEAD HEAD^{tree} > /tmp/workspace-name-dev/revision.txt
          npm ci --prefix frontend --no-audit --no-fund
          tar -czf /tmp/workspace-name-dev/frontend-deps.tar.gz -C frontend node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-name-dev-3b34485
          path: /tmp/workspace-name-dev/
          retention-days: 1
