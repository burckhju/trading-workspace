name: XSTU Schema Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: XSTU schema probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend runtime dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Validate XSTU transport and field semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          import re
          import urllib.request
          from datetime import datetime
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          import httpx

          index = (
              "https://www.boerse-stuttgart.de/de-de/fuer-geschaeftspartner/reports/"
              "mifir-ii-delayed-data/xstu-pre-trade/"
          )
          signed_url = "https://d3s5kssjdy247b.cloudfront.net/XSTU-pretrade-20260904T1311.json.gz?Expires=1789132260&Signature=fV5anp7Z~O5ppbTKqMOIiC203dpNNsFsZldqACItECeRDumoUMZM7l8Pp1AfKAwoOCjhQT8d7~lv2XCRala20KqMB0ZQHC-kJpgKMOLa43YJumXmonvJMnArV2dw8M7uUEuLsRUsN41D5flVTiF46Yn9zWikXv-KMwNeOaSInSMKt8BJLp9qfIsdCURX320HNEx37VY~qMeacVceONPNR62tTvWKxs8oIoTbB-x9K90To5u5VgZmP7nNBT1H9adeFWyAlkCoHJ74kN5stv7MU4AVR55AbJh6RhJxJ9Ag0~4s7pJEyxzTqOGUA2UCq4pIZLnslRX~OLGMiXEO4khBmQ__&Key-Pair-Id=K3HU6T4VCENDE8"

          page = urllib.request.urlopen(index, timeout=30).read().decode("utf-8", "replace")
          short_match = re.search(
              r'href=["\'](?P<href>[^"\']*ddl\.service\.boerse-stuttgart\.de[^"\']*)["\']',
              page,
              flags=re.I,
          )
          print(f"urllib_index_ok={bool(page)}")
          print(f"shortlink_found={bool(short_match)}")
          if short_match:
              short_url = short_match.group("href")
              profiles = {
                  "default": {},
                  "urllib_ua": {"User-Agent": "Python-urllib/3.12"},
                  "browser": {
                      "User-Agent": "Mozilla/5.0 AppleWebKit/537.36 Chrome/140.0 Safari/537.36",
                      "Referer": index,
                      "Accept": "*/*",
                  },
              }
              for name, headers in profiles.items():
                  with httpx.Client(timeout=20.0, follow_redirects=False, headers=headers) as client:
                      response = client.get(short_url)
                      print(f"shortlink_{name}_status={response.status_code}")
                      print(f"shortlink_{name}_has_location={bool(response.headers.get('location'))}")

          target = Path("/tmp/xstu.json.gz")
          with urllib.request.urlopen(signed_url, timeout=60) as response:
              target.write_bytes(response.read())
          payload = json.loads(gzip.decompress(target.read_bytes()).decode("utf-8"))

          fields = (
              "Isin",
              "VenueOfPublication",
              "Bid",
              "Ask",
              "PriceCurrency",
              "TransactionTime",
              "TransactionTimestamp",
          )
          missing = {field: 0 for field in fields}
          timestamp_failures = 0
          timestamp_naive = 0
          time_shape_counts = {}
          zero_bid = zero_ask = negative_bid = negative_ask = 0
          for record in payload:
              for field in fields:
                  if record.get(field) is None:
                      missing[field] += 1
              ts = record.get("TransactionTimestamp")
              if ts is not None:
                  try:
                      parsed = datetime.fromisoformat(str(ts).replace("Z", "+00:00"))
                  except ValueError:
                      timestamp_failures += 1
                  else:
                      if parsed.tzinfo is None:
                          timestamp_naive += 1
              tx_time = record.get("TransactionTime")
              if tx_time is not None:
                  text = str(tx_time)
                  shape = re.sub(r"\d", "D", text)
                  time_shape_counts[shape] = time_shape_counts.get(shape, 0) + 1
              for field in ("Bid", "Ask"):
                  raw = record.get(field)
                  if raw is None:
                      continue
                  try:
                      value = Decimal(str(raw))
                  except InvalidOperation:
                      continue
                  if value == 0:
                      if field == "Bid":
                          zero_bid += 1
                      else:
                          zero_ask += 1
                  elif value < 0:
                      if field == "Bid":
                          negative_bid += 1
                      else:
                          negative_ask += 1

          print(f"records={len(payload)}")
          for field in fields:
              print(f"missing_{field}={missing[field]}")
          print(f"timestamp_parse_failures={timestamp_failures}")
          print(f"timestamp_naive={timestamp_naive}")
          print(f"transaction_time_shape_count={len(time_shape_counts)}")
          for shape, count in sorted(time_shape_counts.items()):
              print(f"transaction_time_shape={shape};count={count}")
          print(f"zero_bid={zero_bid}")
          print(f"zero_ask={zero_ask}")
          print(f"negative_bid={negative_bid}")
          print(f"negative_ask={negative_ask}")
          PY
