name: XSTU Schema Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: XSTU schema probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect verified XSTU payload semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          import re
          import urllib.request
          from collections import Counter
          from decimal import Decimal, InvalidOperation

          signed_url = "https://d3s5kssjdy247b.cloudfront.net/XSTU-pretrade-20260904T1311.json.gz?Expires=1789132260&Signature=fV5anp7Z~O5ppbTKqMOIiC203dpNNsFsZldqACItECeRDumoUMZM7l8Pp1AfKAwoOCjhQT8d7~lv2XCRala20KqMB0ZQHC-kJpgKMOLa43YJumXmonvJMnArV2dw8M7uUEuLsRUsN41D5flVTiF46Yn9zWikXv-KMwNeOaSInSMKt8BJLp9qfIsdCURX320HNEx37VY~qMeacVceONPNR62tTvWKxs8oIoTbB-x9K90To5u5VgZmP7nNBT1H9adeFWyAlkCoHJ74kN5stv7MU4AVR55AbJh6RhJxJ9Ag0~4s7pJEyxzTqOGUA2UCq4pIZLnslRX~OLGMiXEO4khBmQ__&Key-Pair-Id=K3HU6T4VCENDE8"
          compressed = urllib.request.urlopen(signed_url, timeout=60).read()
          payload = json.loads(gzip.decompress(compressed).decode("utf-8"))

          time_shapes = Counter()
          missing_time = 0
          listing_counts = Counter()
          both = bid_only = ask_only = neither = 0
          zero_bid = zero_ask = negative_bid = negative_ask = invalid_bid = invalid_ask = 0
          timestamp_present = 0
          timestamp_and_time = 0

          def numeric(field, record):
              raw = record.get(field)
              try:
                  return Decimal(str(raw))
              except (InvalidOperation, TypeError):
                  return None

          for record in payload:
              tx_time = record.get("TransactionTime")
              if tx_time is None:
                  missing_time += 1
              else:
                  time_shapes[re.sub(r"\d", "D", str(tx_time))] += 1

              has_timestamp = record.get("TransactionTimestamp") is not None
              timestamp_present += int(has_timestamp)
              timestamp_and_time += int(has_timestamp and tx_time is not None)

              listing_counts[(record.get("Isin"), record.get("VenueOfPublication"))] += 1

              bid = numeric("Bid", record)
              ask = numeric("Ask", record)
              if bid is None:
                  invalid_bid += 1
              elif bid == 0:
                  zero_bid += 1
              elif bid < 0:
                  negative_bid += 1
              if ask is None:
                  invalid_ask += 1
              elif ask == 0:
                  zero_ask += 1
              elif ask < 0:
                  negative_ask += 1

              bid_available = bid is not None and bid > 0
              ask_available = ask is not None and ask > 0
              if bid_available and ask_available:
                  both += 1
              elif bid_available:
                  bid_only += 1
              elif ask_available:
                  ask_only += 1
              else:
                  neither += 1

          duplicate_groups = sum(1 for count in listing_counts.values() if count > 1)
          max_records_per_listing = max(listing_counts.values(), default=0)
          print(f"records={len(payload)}")
          print(f"missing_TransactionTime={missing_time}")
          print(f"transaction_time_shape_count={len(time_shapes)}")
          for shape, count in sorted(time_shapes.items()):
              print(f"transaction_time_shape={shape};count={count}")
          print(f"timestamp_present={timestamp_present}")
          print(f"timestamp_and_time={timestamp_and_time}")
          print(f"unique_listing_keys={len(listing_counts)}")
          print(f"duplicate_listing_groups={duplicate_groups}")
          print(f"max_records_per_listing={max_records_per_listing}")
          print(f"quote_both={both}")
          print(f"quote_bid_only={bid_only}")
          print(f"quote_ask_only={ask_only}")
          print(f"quote_neither={neither}")
          print(f"zero_bid={zero_bid}")
          print(f"zero_ask={zero_ask}")
          print(f"negative_bid={negative_bid}")
          print(f"negative_ask={negative_ask}")
          print(f"invalid_bid={invalid_bid}")
          print(f"invalid_ask={invalid_ask}")
          PY
