name: XSTU Schema Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: XSTU schema probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download one officially resolved XSTU payload and print structural schema only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          from pathlib import Path

          url = "https://d3s5kssjdy247b.cloudfront.net/XSTU-pretrade-20260904T1311.json.gz?Expires=1789132260&Signature=fV5anp7Z~O5ppbTKqMOIiC203dpNNsFsZldqACItECeRDumoUMZM7l8Pp1AfKAwoOCjhQT8d7~lv2XCRala20KqMB0ZQHC-kJpgKMOLa43YJumXmonvJMnArV2dw8M7uUEuLsRUsN41D5flVTiF46Yn9zWikXv-KMwNeOaSInSMKt8BJLp9qfIsdCURX320HNEx37VY~qMeacVceONPNR62tTvWKxs8oIoTbB-x9K90To5u5VgZmP7nNBT1H9adeFWyAlkCoHJ74kN5stv7MU4AVR55AbJh6RhJxJ9Ag0~4s7pJEyxzTqOGUA2UCq4pIZLnslRX~OLGMiXEO4khBmQ__&Key-Pair-Id=K3HU6T4VCENDE8"
          target = Path("/tmp/xstu.json.gz")
          with urllib.request.urlopen(url, timeout=60) as response:
              target.write_bytes(response.read())
          print("source_file=XSTU-pretrade-20260904T1311.json.gz")
          print(f"downloaded_bytes={target.stat().st_size}")
          PY
          PYTHONPATH=backend python -m app.providers.stuttgart_delayed.schema_probe /tmp/xstu.json.gz
