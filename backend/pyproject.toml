[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trading-workspace-backend"
version = "0.1.0"
description = "Backend application for the Trading Workspace"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "pydantic-settings==2.14.1",
  "pypdf==6.0.0",
  "python-multipart==0.0.20",
  "sqlalchemy[asyncio]==2.0.50",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
dev = [
  "black==26.1.0",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["../tests/unit/backend", "../tests/integration/backend"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = ["py312"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true
