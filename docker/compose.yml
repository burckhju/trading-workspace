name: trading-workspace

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      TRADING_WORKSPACE_APPLICATION_NAME: ${TRADING_WORKSPACE_APPLICATION_NAME:-Trading Workspace API}
      TRADING_WORKSPACE_ENVIRONMENT: ${TRADING_WORKSPACE_ENVIRONMENT:-development}
      TRADING_WORKSPACE_DEBUG: ${TRADING_WORKSPACE_DEBUG:-false}
      TRADING_WORKSPACE_LOG_LEVEL: ${TRADING_WORKSPACE_LOG_LEVEL:-INFO}
      TRADING_WORKSPACE_DOCUMENTATION_ENABLED: ${TRADING_WORKSPACE_DOCUMENTATION_ENABLED:-true}
      TRADING_WORKSPACE_DATABASE_URL: ${TRADING_WORKSPACE_DATABASE_URL:?TRADING_WORKSPACE_DATABASE_URL is required}
      TRADING_WORKSPACE_DATABASE_ECHO: ${TRADING_WORKSPACE_DATABASE_ECHO:-false}
      TRADING_WORKSPACE_DATABASE_POOL_SIZE: ${TRADING_WORKSPACE_DATABASE_POOL_SIZE:-5}
      TRADING_WORKSPACE_DATABASE_MAX_OVERFLOW: ${TRADING_WORKSPACE_DATABASE_MAX_OVERFLOW:-10}
      TRADING_WORKSPACE_DATABASE_POOL_RECYCLE_SECONDS: ${TRADING_WORKSPACE_DATABASE_POOL_RECYCLE_SECONDS:-1800}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
